<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>卓球 試合分析</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px 14px 40px;
  background:#f4f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  margin:5px 0 20px;
  font-size:26px;
}

h2{
  font-size:20px;
  margin:0 0 15px;
}

h3{
  margin-top:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  margin-bottom:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 16px;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.primary{
  width:100%;
  background:#222;
  color:white;
}

.score-area{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.player{
  flex:1;
  text-align:center;
}

.player-name{
  font-weight:bold;
  font-size:18px;
  margin-bottom:5px;
}

.score{
  font-size:64px;
  font-weight:bold;
  line-height:1.1;
}

.point-btn{
  width:100%;
  margin-top:10px;
  background:#eee;
}

.undo{
  width:100%;
  margin-top:12px;
  background:#f1f1f1;
}

.game-info{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.game-score{
  text-align:center;
  font-size:15px;
  color:#666;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#f5f5f5;
  border-radius:12px;
  padding:12px;
  text-align:center;
}

.stat-title{
  font-size:13px;
  color:#666;
}

.stat-value{
  font-size:22px;
  font-weight:bold;
  margin-top:4px;
}

.reason-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.reason-btn{
  background:#eee;
}

.reason-btn.selected{
  background:#222;
  color:white;
}

.hidden{
  display:none !important;
}

.notice{
  text-align:center;
  padding:10px;
  font-size:14px;
  color:#666;
}

.history-item{
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  background:#fff;
}

.history-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.win{
  color:#167c35;
  font-weight:bold;
}

.lose{
  color:#c62828;
  font-weight:bold;
}

.draw{
  color:#666;
  font-weight:bold;
}

.small{
  font-size:13px;
  color:#666;
}

.detail{
  background:#f7f7f7;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}

.game-row{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid #ddd;
}

.game-row:last-child{
  border-bottom:0;
}

.delete-btn{
  background:#f3f3f3;
  font-size:13px;
  padding:8px 10px;
}

.reflection{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#fff8df;
}

.empty{
  text-align:center;
  color:#777;
  padding:15px 0;
}

.saved{
  text-align:center;
  font-size:12px;
  color:#777;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏓 卓球 試合分析</h1>

<div class="card">
  <h2>選手名</h2>

  <input id="meName" placeholder="自分の名前">
  <input id="oppName" placeholder="相手の名前">

  <button class="primary" onclick="startNewMatch()">
    ▶ 試合開始
  </button>

  <div id="saved" class="saved"></div>
</div>


<div id="matchArea" class="hidden">

<div class="card">

  <div class="game-info">
    第<span id="gameNumber">1</span>ゲーム
  </div>

  <div id="gameScore" class="game-score">
    ゲームカウント 0 - 0
  </div>

  <div class="score-area">

    <div class="player">
      <div id="meDisplayName" class="player-name">自分</div>
      <div id="myScore" class="score">0</div>

      <button class="point-btn" onclick="addPoint('me')">
        ＋ 自分の得点
      </button>
    </div>

    <div style="font-size:22px;">-</div>

    <div class="player">
      <div id="oppDisplayName" class="player-name">相手</div>
      <div id="oppScore" class="score">0</div>

      <button class="point-btn" onclick="addPoint('opp')">
        ＋ 相手の得点
      </button>
    </div>

  </div>

  <button class="undo" onclick="undo()">
    ↩ 1点戻す
  </button>

</div>


<div id="reasonArea" class="card hidden">

  <h2>失点理由</h2>

  <div class="notice">
    相手の得点になった理由を選択してください
  </div>

  <div class="reason-buttons">

    <button class="reason-btn" onclick="selectReason('サーブミス')">
      サーブミス
    </button>

    <button class="reason-btn" onclick="selectReason('レシーブミス')">
      レシーブミス
    </button>

    <button class="reason-btn" onclick="selectReason('攻撃ミス')">
      攻撃ミス
    </button>

    <button class="reason-btn" onclick="selectReason('守備ミス')">
      守備ミス
    </button>

    <button class="reason-btn" onclick="selectReason('判断ミス')">
      判断ミス
    </button>

    <button class="reason-btn" onclick="selectReason('その他')">
      その他
    </button>

  </div>

</div>


<div class="card">

  <h2>📈 現在の分析</h2>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">最大連続得点</div>
      <div id="maxWin" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">最大連続失点</div>
      <div id="maxLose" class="stat-value">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">終盤得点率</div>
      <div id="endgameRate" class="stat-value">-</div>
    </div>

    <div class="stat">
      <div class="stat-title">接戦判定</div>
      <div id="closeGame" class="stat-value">-</div>
    </div>

  </div>

  <div id="currentIssue"></div>

</div>


<div class="card">

  <h2>📝 現在の失点理由</h2>

  <div id="currentReasons">
    まだ失点していません。
  </div>

</div>

</div>


<div class="card">

  <h2>📚 試合履歴</h2>

  <div id="historyList">
    読み込み中...
  </div>

</div>

</div>


<script>

/* =========================================
   設定
========================================= */

const STORAGE_KEY = "tableTennisAnalyzer";
const OLD_HISTORY_KEY = "tableTennisMatchHistory";

const DB_NAME = "TableTennisAnalyzerDB";
const DB_VERSION = 1;
const STORE_NAME = "matches";


/* =========================================
   試合データ
========================================= */

let me = 0;
let opp = 0;

let game = 1;

let games = [];

let points = [];

let reasons = [];

let streak = 0;

let maxWin = 0;
let maxLose = 0;

let waitingReason = false;

let matchHistory = [];

let currentMatchStarted = false;


/* =========================================
   IndexedDB
========================================= */

let db = null;

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = function(event){

      const database = event.target.result;

      if(!database.objectStoreNames.contains(STORE_NAME)){

        database.createObjectStore(
          STORE_NAME,
          {keyPath:"id"}
        );

      }

    };

    request.onsuccess = function(event){

      db = event.target.result;

      resolve(db);

    };

    request.onerror = function(){

      reject(request.error);

    };

  });

}


/* =========================================
   IndexedDBへ履歴保存
========================================= */

function saveHistoryToDB(item){

  return new Promise((resolve,reject)=>{

    if(!db){
      reject(new Error("DB not ready"));
      return;
    }

    const transaction =
      db.transaction(STORE_NAME,"readwrite");

    const store =
      transaction.objectStore(STORE_NAME);

    store.put(item);

    transaction.oncomplete = function(){
      resolve();
    };

    transaction.onerror = function(){
      reject(transaction.error);
    };

  });

}


/* =========================================
   IndexedDBから履歴取得
========================================= */

function getHistoryFromDB(){

  return new Promise((resolve,reject)=>{

    if(!db){
      reject(new Error("DB not ready"));
      return;
    }

    const transaction =
      db.transaction(STORE_NAME,"readonly");

    const store =
      transaction.objectStore(STORE_NAME);

    const request =
      store.getAll();

    request.onsuccess = function(){

      const data = request.result || [];

      data.sort((a,b)=>b.id-a.id);

      resolve(data);

    };

    request.onerror = function(){

      reject(request.error);

    };

  });

}


/* =========================================
   IndexedDBの履歴削除
========================================= */

function deleteHistoryFromDB(id){

  return new Promise((resolve,reject)=>{

    if(!db){
      reject(new Error("DB not ready"));
      return;
    }

    const transaction =
      db.transaction(STORE_NAME,"readwrite");

    const store =
      transaction.objectStore(STORE_NAME);

    store.delete(id);

    transaction.oncomplete = function(){
      resolve();
    };

    transaction.onerror = function(){
      reject(transaction.error);
    };

  });

}


/* =========================================
   全履歴削除
========================================= */

function clearHistoryDB(){

  return new Promise((resolve,reject)=>{

    if(!db){
      reject(new Error("DB not ready"));
      return;
    }

    const transaction =
      db.transaction(STORE_NAME,"readwrite");

    const store =
      transaction.objectStore(STORE_NAME);

    store.clear();

    transaction.oncomplete = function(){
      resolve();
    };

    transaction.onerror = function(){
      reject(transaction.error);
    };

  });

}


/* =========================================
   localStorage保存
========================================= */

function saveCurrentData(){

  try{

    const data = {

      meName:
        document.getElementById("meName").value,

      oppName:
        document.getElementById("oppName").value,

      me:me,
      opp:opp,

      game:game,

      games:games,

      points:points,

      reasons:reasons,

      streak:streak,

      maxWin:maxWin,

      maxLose:maxLose,

      currentMatchStarted:
        currentMatchStarted

    };

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

    document.getElementById("saved").textContent =
      "💾 自動保存済み";

  }catch(error){

    console.log(
      "localStorage保存エラー",
      error
    );

  }

}


/* =========================================
   起動時復元
========================================= */

async function loadData(){

  /* -------------------------
     IndexedDB
  ------------------------- */

  try{

    await openDB();

    const dbHistory =
      await getHistoryFromDB();

    if(dbHistory.length > 0){

      matchHistory = dbHistory;

    }else{

      /*
       古いlocalStorage履歴があれば
       IndexedDBへ移行
      */

      migrateOldHistory();

    }

  }catch(error){

    console.log(
      "IndexedDB読み込みエラー",
      error
    );

    /*
      IndexedDBが使えない場合は
      localStorageから復元
    */

    loadHistoryFromLocalStorage();

  }


  /* -------------------------
     現在の試合
  ------------------------- */

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(saved){

      const data =
        JSON.parse(saved);

      document.getElementById("meName").value =
        data.meName || "";

      document.getElementById("oppName").value =
        data.oppName || "";

      me = Number(data.me) || 0;
      opp = Number(data.opp) || 0;

      game = Number(data.game) || 1;

      games =
        Array.isArray(data.games)
        ? data.games
        : [];

      points =
        Array.isArray(data.points)
        ? data.points
        : [];

      reasons =
        Array.isArray(data.reasons)
        ? data.reasons
        : [];

      streak =
        Number(data.streak) || 0;

      maxWin =
        Number(data.maxWin) || 0;

      maxLose =
        Number(data.maxLose) || 0;

      currentMatchStarted =
        Boolean(data.currentMatchStarted);

      if(currentMatchStarted){

        document
          .getElementById("matchArea")
          .classList.remove("hidden");

      }

      updateUI();

    }

  }catch(error){

    console.log(
      "現在の試合復元エラー",
      error
    );

  }

  renderHistory();

}


/* =========================================
   古いlocalStorage履歴を移行
========================================= */

async function migrateOldHistory(){

  try{

    const old =
      localStorage.getItem(OLD_HISTORY_KEY);

    if(!old){

      /*
       以前の保存形式も確認
      */

      const oldMain =
        localStorage.getItem(STORAGE_KEY);

      if(!oldMain){
        return;
      }

      const data =
        JSON.parse(oldMain);

      if(
        !Array.isArray(data.matchHistory) ||
        data.matchHistory.length === 0
      ){

        return;

      }

      matchHistory =
        data.matchHistory;

    }else{

      matchHistory =
        JSON.parse(old);

    }

    if(!Array.isArray(matchHistory)){
      matchHistory=[];
      return;
    }

    for(const item of matchHistory){

      if(!item.id){
        item.id =
          Date.now() +
          Math.floor(Math.random()*100000);
      }

      await saveHistoryToDB(item);

    }

  }catch(error){

    console.log(
      "履歴移行エラー",
      error
    );

    loadHistoryFromLocalStorage();

  }

}


/* =========================================
   localStorage履歴復元
========================================= */

function loadHistoryFromLocalStorage(){

  try{

    const old =
      localStorage.getItem(
        OLD_HISTORY_KEY
      );

    if(old){

      const parsed =
        JSON.parse(old);

      if(Array.isArray(parsed)){

        matchHistory = parsed;

      }

    }

  }catch(error){

    console.log(
      "履歴読み込みエラー",
      error
    );

  }

}


/* =========================================
   新しい試合開始
========================================= */

function startNewMatch(){

  const meName =
    document.getElementById("meName").value.trim();

  const oppName =
    document.getElementById("oppName").value.trim();

  if(!meName){

    alert("自分の名前を入力してください");

    return;

  }

  if(!oppName){

    alert("相手の名前を入力してください");

    return;

  }

  me=0;
  opp=0;

  game=1;

  games=[];

  points=[];

  reasons=[];

  streak=0;

  maxWin=0;
  maxLose=0;

  waitingReason=false;

  currentMatchStarted=true;

  document
    .getElementById("matchArea")
    .classList.remove("hidden");

  updateUI();

  saveCurrentData();

}


/* =========================================
   得点
========================================= */

function addPoint(player){

  if(!currentMatchStarted){
    return;
  }

  /*
    相手得点の場合、
    理由入力を待つ
  */

  if(player==="opp"){

    opp++;

    streak--;

    if(streak < 0){

      maxLose =
        Math.max(
          maxLose,
          Math.abs(streak)
        );

    }

    points.push({

      player:"opp",

      reason:null

    });

    waitingReason=true;

    document
      .getElementById("reasonArea")
      .classList.remove("hidden");

  }else{

    me++;

    if(streak < 0){

      streak=1;

    }else{

      streak++;

    }

    maxWin =
      Math.max(
        maxWin,
        streak
      );

    points.push({

      player:"me",

      reason:null

    });

  }

  updateUI();

  saveCurrentData();

}


/* =========================================
   失点理由
========================================= */

function selectReason(reason){

  if(!waitingReason){
    return;
  }

  /*
    最新の相手得点に理由を付ける
  */

  const last =
    points[points.length-1];

  if(
    last &&
    last.player==="opp"
  ){

    last.reason=reason;

  }

  reasons.push(reason);

  waitingReason=false;

  document
    .getElementById("reasonArea")
    .classList.add("hidden");

  updateUI();

  saveCurrentData();

  /*
    失点理由を選択したあと
    ゲーム終了判定
  */

  checkGameEnd();

}


/* =========================================
   ゲーム終了判定
========================================= */

function checkGameEnd(){

  /*
    通常：
    11点以上かつ2点差

    デュース：
    10-10以降、2点差
  */

  const finished =
    (
      (me>=11 || opp>=11) &&
      Math.abs(me-opp)>=2
    );

  if(!finished){
    return;
  }

  endGame();

}


/* =========================================
   ゲーム終了
========================================= */

function endGame(){

  const winner =
    me > opp ? "me" : "opp";

  const gameData={

    game:game,

    me:me,

    opp:opp,

    winner:winner,

    points:
      points.map(p=>({...p}))

  };

  games.push(gameData);

  /*
    3ゲーム先取
  */

  const myWins =
    games.filter(g=>g.winner==="me").length;

  const oppWins =
    games.filter(g=>g.winner==="opp").length;


  if(myWins>=3 || oppWins>=3){

    finishMatch();

    return;

  }


  /*
    次のゲーム
  */

  me=0;
  opp=0;

  points=[];

  streak=0;

  maxWin=0;
  maxLose=0;

  reasons=[];

  waitingReason=false;

  game++;

  updateUI();

  saveCurrentData();

  alert(
    `第${game-1}ゲーム終了！\n` +
    `次は第${game}ゲームです。`
  );

}


/* =========================================
   試合終了
========================================= */

async function finishMatch(){

  const meName =
    document.getElementById("meName").value.trim();

  const oppName =
    document.getElementById("oppName
