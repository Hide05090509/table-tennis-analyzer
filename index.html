<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>卓球試合分析</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px 12px 40px;
  background:#f4f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  margin:5px 0 20px;
}

h2{
  font-size:19px;
  margin:0 0 14px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:13px;
  margin-bottom:9px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:16px;
}

.primary{
  width:100%;
  background:#222;
  color:#fff;
}

.score-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.player{
  flex:1;
  text-align:center;
}

.player-name{
  font-weight:bold;
  font-size:17px;
}

.score{
  font-size:60px;
  font-weight:bold;
  margin:5px 0;
}

.point-btn{
  width:100%;
  background:#eee;
}

.undo{
  width:100%;
  margin-top:12px;
  background:#eee;
}

.game-info{
  text-align:center;
  font-weight:bold;
  font-size:18px;
  margin-bottom:8px;
}

.game-count{
  text-align:center;
  color:#666;
  margin-bottom:15px;
}

.reason-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.reason-btn{
  background:#eee;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  background:#f4f4f4;
  border-radius:10px;
  padding:12px;
  text-align:center;
}

.stat-title{
  color:#666;
  font-size:13px;
}

.stat-value{
  font-size:21px;
  font-weight:bold;
  margin-top:4px;
}

.hidden{
  display:none;
}

.notice{
  text-align:center;
  color:#666;
  font-size:13px;
  margin-bottom:10px;
}

.history-item{
  border:1px solid #ddd;
  border-radius:11px;
  padding:13px;
  margin-bottom:10px;
}

.history-top{
  display:flex;
  justify-content:space-between;
}

.win{
  color:#16833a;
  font-weight:bold;
}

.lose{
  color:#c62828;
  font-weight:bold;
}

.small{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.detail{
  background:#f7f7f7;
  border-radius:9px;
  padding:10px;
  margin-top:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #ddd;
}

.row:last-child{
  border-bottom:0;
}

.detail-btn{
  width:100%;
  margin-top:10px;
  background:#eee;
}

.delete-btn{
  margin-top:10px;
  background:#eee;
  font-size:13px;
}

.issue{
  background:#fff8dc;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}

.empty{
  text-align:center;
  color:#777;
  padding:15px;
}

.saved{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:8px;
}

.finish-message{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  padding:10px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>🏓 卓球 試合分析</h1>

<div class="card">

<h2>選手名</h2>

<input id="meName" placeholder="自分の名前">
<input id="oppName" placeholder="相手の名前">

<button class="primary" onclick="startMatch()">
▶ 試合開始
</button>

<div id="saved" class="saved"></div>

</div>


<div id="matchArea" class="hidden">

<div class="card">

<div class="game-info">
第<span id="gameNumber">1</span>ゲーム
</div>

<div id="gameCount" class="game-count">
ゲームカウント 0 - 0
</div>

<div class="score-area">

<div class="player">

<div id="meDisplay" class="player-name">
自分
</div>

<div id="meScore" class="score">
0
</div>

<button class="point-btn" onclick="point('me')">
＋ 自分の得点
</button>

</div>

<div>−</div>

<div class="player">

<div id="oppDisplay" class="player-name">
相手
</div>

<div id="oppScore" class="score">
0
</div>

<button class="point-btn" onclick="point('opp')">
＋ 相手の得点
</button>

</div>

</div>

<button class="undo" onclick="undo()">
↩ 1点戻す
</button>

</div>


<div id="reasonArea" class="card hidden">

<h2>失点理由</h2>

<div class="notice">
相手の得点になった理由を選択してください
</div>

<div class="reason-buttons">

<button class="reason-btn" onclick="reason('サーブミス')">
サーブミス
</button>

<button class="reason-btn" onclick="reason('レシーブミス')">
レシーブミス
</button>

<button class="reason-btn" onclick="reason('攻撃ミス')">
攻撃ミス
</button>

<button class="reason-btn" onclick="reason('守備ミス')">
守備ミス
</button>

<button class="reason-btn" onclick="reason('判断ミス')">
判断ミス
</button>

<button class="reason-btn" onclick="reason('その他')">
その他
</button>

</div>

</div>


<div class="card">

<h2>📈 現在の分析</h2>

<div class="stats">

<div class="stat">
<div class="stat-title">最大連続得点</div>
<div id="maxWin" class="stat-value">0</div>
</div>

<div class="stat">
<div class="stat-title">最大連続失点</div>
<div id="maxLose" class="stat-value">0</div>
</div>

<div class="stat">
<div class="stat-title">終盤得点率</div>
<div id="lateRate" class="stat-value">-</div>
</div>

<div class="stat">
<div class="stat-title">接戦</div>
<div id="closeGame" class="stat-value">-</div>
</div>

</div>

<div id="issue"></div>

</div>


<div class="card">

<h2>📝 失点理由</h2>

<div id="reasonList">
まだ失点していません。
</div>

</div>

</div>


<div class="card">

<h2>📚 試合履歴</h2>

<div id="historyList"></div>

</div>

</div>


<script>

var me = 0;
var opp = 0;

var game = 1;

var games = [];
var points = [];
var reasons = [];

var maxWin = 0;
var maxLose = 0;

var waitingReason = false;
var matchStarted = false;

var history = [];

var STORAGE = "table_tennis_analyzer_v4";


/* =========================
保存
========================= */

function save(){

  try{

    var data = {
      meName:document.getElementById("meName").value,
      oppName:document.getElementById("oppName").value,

      me:me,
      opp:opp,
      game:game,

      games:games,
      points:points,
      reasons:reasons,

      maxWin:maxWin,
      maxLose:maxLose,

      waitingReason:waitingReason,
      matchStarted:matchStarted,

      history:history
    };

    localStorage.setItem(
      STORAGE,
      JSON.stringify(data)
    );

    document.getElementById("saved").textContent =
      "💾 自動保存済み";

  }catch(e){

    console.log("保存エラー",e);

  }

}


/* =========================
読み込み
========================= */

function load(){

  try{

    var saved =
      localStorage.getItem(STORAGE);

    if(saved){

      var data =
        JSON.parse(saved);

      document.getElementById("meName").value =
        data.meName || "";

      document.getElementById("oppName").value =
        data.oppName || "";

      me = Number(data.me) || 0;
      opp = Number(data.opp) || 0;

      game = Number(data.game) || 1;

      games =
        Array.isArray(data.games)
        ? data.games
        : [];

      points =
        Array.isArray(data.points)
        ? data.points
        : [];

      reasons =
        Array.isArray(data.reasons)
        ? data.reasons
        : [];

      maxWin =
        Number(data.maxWin) || 0;

      maxLose =
        Number(data.maxLose) || 0;

      waitingReason =
        data.waitingReason === true;

      matchStarted =
        data.matchStarted === true;

      history =
        Array.isArray(data.history)
        ? data.history
        : [];

    }

  }catch(e){

    console.log("読み込みエラー",e);

  }

  renderHistory();

  if(matchStarted){

    document
      .getElementById("matchArea")
      .classList
      .remove("hidden");

  }

  update();

}


/* =========================
試合開始
========================= */

function startMatch(){

  var myName =
    document.getElementById("meName")
    .value
    .trim();

  var opponentName =
    document.getElementById("oppName")
    .value
    .trim();

  if(!myName){

    alert("自分の名前を入力してください");
    return;

  }

  if(!opponentName){

    alert("相手の名前を入力してください");
    return;

  }

  me = 0;
  opp = 0;

  game = 1;

  games = [];
  points = [];
  reasons = [];

  maxWin = 0;
  maxLose = 0;

  waitingReason = false;
  matchStarted = true;

  document
    .getElementById("matchArea")
    .classList
    .remove("hidden");

  document
    .getElementById("reasonArea")
    .classList
    .add("hidden");

  update();
  save();

}


/* =========================
得点
========================= */

function point(player){

  if(!matchStarted){
    return;
  }

  if(waitingReason){

    alert("先に失点理由を選択してください");
    return;

  }


  if(player === "me"){

    me++;

    points.push({
      player:"me",
      reason:null
    });

  }else{

    opp++;

    points.push({
      player:"opp",
      reason:null
    });

    waitingReason = true;

    document
      .getElementById("reasonArea")
      .classList
      .remove("hidden");

  }


  calculateStats();
  update();
  save();


  /*
    自分が点を取った場合は
    その瞬間にゲーム終了判定
  */

  if(player === "me"){

    checkEnd();

  }

}


/* =========================
失点理由
========================= */

function reason(value){

  if(!waitingReason){
    return;
  }

  var last =
    points[points.length - 1];

  if(last && last.player === "opp"){

    last.reason = value;

    reasons.push(value);

  }

  waitingReason = false;

  document
    .getElementById("reasonArea")
    .classList
    .add("hidden");

  calculateStats();
  update();
  save();


  /*
    相手の点でゲーム終了する場合は
    理由入力が終わった直後に判定
  */

  checkEnd();

}


/* =========================
終了判定
========================= */

function checkEnd(){

  if(!matchStarted){
    return;
  }


  /*
    卓球のゲーム終了条件

    11点以上
    ＋
    2点差以上
  */

  var gameFinished =

    (
      (me >= 11 || opp >= 11)
      &&
      Math.abs(me - opp) >= 2
    );


  if(gameFinished){

    finishGame();

  }

}


/* =========================
ゲーム終了
========================= */

function finishGame(){

  if(!matchStarted){
    return;
  }


  /*
    二重終了防止
  */

  var alreadySaved =
    games.some(function(g){

      return (
        g.game === game &&
        g.me === me &&
        g.opp === opp
      );

    });


  if(alreadySaved){
    return;
  }


  var winner =
    me > opp
    ? "me"
    : "opp";


  /*
    現在のゲームを保存
  */

  games.push({

    game:game,

    me:me,
    opp:opp,

    winner:winner,

    points:points.map(function(p){

      return {

        player:p.player,

        reason:p.reason

      };

    })

  });


  /*
    ゲーム勝利数を計算
  */

  var myWins =
    games.filter(function(g){

      return g.winner === "me";

    }).length;


  var oppWins =
    games.filter(function(g){

      return g.winner === "opp";

    }).length;


  /*
    ★ここが重要

    3勝した瞬間に
    次のゲームへ行かず
    試合終了へ
  */

  if(myWins >= 3 || oppWins >= 3){

    finishMatch();

    return;

  }


  /*
    まだ試合継続
  */

  var finishedGame = game;

  me = 0;
  opp = 0;

  points = [];
  reasons = [];

  maxWin = 0;
  maxLose = 0;

  waitingReason = false;

  game++;


  document
    .getElementById("reasonArea")
    .classList
    .add("hidden");


  update();
  save();


  alert(
    "第" +
    finishedGame +
    "ゲーム終了！\n\n" +
    "次は第" +
    game +
    "ゲームです。"
  );

}


/* =========================
試合終了
========================= */

function finishMatch(){

  /*
    現在のゲームを含めて
    最終結果を計算
  */

  var myWins =
    games.filter(function(g){

      return g.winner === "me";

    }).length;


  var oppWins =
    games.filter(function(g){

      return g.winner === "opp";

    }).length;


  var myName =
    document.getElementById("meName")
    .value
    .trim();

  var opponentName =
    document.getElementById("oppName")
    .value
    .trim();


  /*
    失点理由集計
  */

  var reasonCount = {};


  games.forEach(function(g){

    if(!Array.isArray(g.points)){
      return;
    }

    g.points.forEach(function(p){

      if(
        p.player === "opp" &&
        p.reason
      ){

        reasonCount[p.reason] =
          (reasonCount[p.reason] || 0) + 1;

      }

    });

  });


  /*
    一番多かった理由
  */

  var sorted =
    Object.keys(reasonCount)
    .sort(function(a,b){

      return (
        reasonCount[b] -
        reasonCount[a]
      );

    });


  var topReasons = [];


  if(sorted.length){

    var highest =
      reasonCount[sorted[0]];

    topReasons =
      sorted.filter(function(r){

        return (
          reasonCount[r] === highest
        );

      });

  }


  /*
    履歴データ作成
  */

  var item = {

    id:Date.now(),

    date:
      new Date()
      .toLocaleString("ja-JP"),

    meName:myName,

    oppName:opponentName,

    myWins:myWins,

    oppWins:oppWins,

    winner:
      myWins > oppWins
      ? "me"
      : "opp",

    games:
      JSON.parse(
        JSON.stringify(games)
      ),

    reasons:reasonCount,

    topReasons:topReasons

  };


  /*
    履歴に保存
  */

  history.unshift(item);


  /*
    ★試合終了を先に確定
  */

  matchStarted = false;
  waitingReason = false;


  document
    .getElementById("reasonArea")
    .classList
    .add("hidden");

  document
    .getElementById("matchArea")
    .classList
    .add("hidden");


  /*
    保存
  */

  save();

  renderHistory();


  /*
    結果表示
  */

  alert(
    "🏓 試合終了！\n\n" +

    myName +
    " " +
    myWins +
    " - " +
    oppWins +
    " " +
    opponentName +

    "\n\n📚 試合履歴に保存しました。"
  );


  /*
    次の試合のためにリセット

    履歴は残す
  */

  me = 0;
  opp = 0;

  game = 1;

  games = [];
  points = [];
  reasons = [];

  maxWin = 0;
  maxLose = 0;

  waitingReason = false;
  matchStarted = false;


  save();

  update();

}


/* =========================
1点戻す
========================= */

function undo(){

  if(!matchStarted){
    return;
  }

  if(waitingReason){

    alert("先に失点理由を選択してください");
    return;

  }

  if(points.length === 0){
    return;
  }


  var last =
    points.pop();


  if(last.player === "me"){

    me--;

  }else{

    opp--;

    if(last.reason){

      var index =
        reasons.lastIndexOf(
          last.reason
        );

      if(index !== -1){

        reasons.splice(index,1);

      }

    }

  }


  waitingReason = false;

  document
    .getElementById("reasonArea")
    .classList
    .add("hidden");


  calculateStats();
  update();
  save();

}


/* =========================
分析
========================= */

function calculateStats(){

  var currentWin = 0;
  var currentLose = 0;

  maxWin = 0;
  maxLose = 0;


  points.forEach(function(p){

    if(p.player === "me"){

      currentWin++;
      currentLose = 0;

    }else{

      currentLose++;
      currentWin = 0;

    }


    if(currentWin > maxWin){

      maxWin = currentWin;

    }

    if(currentLose > maxLose){

      maxLose = currentLose;

    }

  });

}


/* =========================
表示更新
========================= */

function update(){

  document.getElementById("gameNumber")
    .textContent = game;

  document.getElementById("meScore")
    .textContent = me;

  document.getElementById("oppScore")
    .textContent = opp;


  document.getElementById("meDisplay")
    .textContent =
      document.getElementById("meName")
      .value
      .trim() || "自分";


  document.getElementById("oppDisplay")
    .textContent =
      document.getElementById("oppName")
      .value
      .trim() || "相手";


  var myWins =
    games.filter(function(g){

      return g.winner === "me";

    }).length;


  var oppWins =
    games.filter(function(g){

      return g.winner === "opp";

    }).length;


  document.getElementById("gameCount")
    .textContent =
      "ゲームカウント " +
      myWins +
      " - " +
      oppWins;


  document.getElementById("maxWin")
    .textContent = maxWin;


  document.getElementById("maxLose")
    .textContent = maxLose;


  /*
    終盤得点率

    7点以降の自分の得点 /
    7点以降の自分＋相手の得点
  */

  var lateTotal = 0;
  var lateMe = 0;


  points.forEach(function(p,index){

    /*
      その時点の得点を計算
    */

    var m = 0;
    var o = 0;

    for(
      var i=0;
      i<=index;
      i++
    ){

      if(points[i].player === "me"){
        m++;
      }else{
        o++;
      }

    }


    if(m + o >= 7){

      lateTotal++;

      if(p.player === "me"){

        lateMe++;

      }

    }

  });


  if(lateTotal > 0){

    document.getElementById("lateRate")
      .textContent =
        Math.round(
          lateMe / lateTotal * 100
        ) + "%";

  }else{

    document.getElementById("lateRate")
      .textContent = "-";

  }


  /*
    接戦判定
  */

  if(
    me >= 8 &&
    opp >= 8 &&
    Math.abs(me - opp) <= 2
  ){

    document.getElementById("closeGame")
      .textContent = "接戦";

  }else{

    document.getElementById("closeGame")
      .textContent = "-";

  }


  /*
    失点理由表示
  */

  renderReasons();

  /*
    今回の課題
  */

  var count = {};

  reasons.forEach(function(r){

    count[r] =
      (count[r] || 0) + 1;

  });


  var keys =
    Object.keys(count)
    .sort(function(a,b){

      return count[b] - count[a];

    });


  var issue =
    document.getElementById("issue");


  if(keys.length){

    issue.innerHTML =
      '<div class="issue">' +
      "⚠️ 今回の課題：<strong>" +
      keys[0] +
      "</strong>" +
      "</div>";

  }else{

    issue.innerHTML = "";

  }

}


/* =========================
失点理由表示
========================= */

function renderReasons(){

  var area =
    document.getElementById("reasonList");


  if(reasons.length === 0){

    area.textContent =
      "まだ失点していません。";

    return;

  }


  var count = {};


  reasons.forEach(function(r){

    count[r] =
      (count[r] || 0) + 1;

  });


  var html = "";


  Object.keys(count)
    .sort(function(a,b){

      return count[b] - count[a];

    })
    .forEach(function(r){

      html +=
        '<div class="row">' +

        "<span>" +
        r +
        "</span>" +

        "<strong>" +
        count[r] +
        "回" +
        "</strong>" +

        "</div>";

    });


  area.innerHTML = html;

}


/* =========================
履歴表示
========================= */

function renderHistory(){

  var area =
    document.getElementById(
      "historyList"
    );


  if(!history.length){

    area.innerHTML =
      '<div class="empty">' +
      "まだ試合履歴がありません。" +
      "</div>";

    return;

  }


  area.innerHTML = "";


  history.forEach(function(item,index){

    var resultClass =
      item.winner === "me"
      ? "win"
      : "lose";


    var resultText =
      item.winner === "me"
      ? "勝利"
      : "敗北";


    var gameScores = "";


    if(Array.isArray(item.games)){

      item.games.forEach(function(g){

        gameScores +=
          "G" +
          g.game +
          " " +
          g.me +
          "-" +
          g.opp +
          "　";

      });

    }


    var reasonsText = "";


    if(item.reasons){

      Object.keys(item.reasons)
        .sort(function(a,b){

          return (
            item.reasons[b] -
            item.reasons[a]
          );

        })
        .forEach(function(r){

          reasonsText +=
            "<div class='row'>" +
            "<span>" +
            r +
            "</span>" +
            "<strong>" +
            item.reasons[r] +
            "回" +
            "</strong>" +
            "</div>";

        });

    }


    var topText = "";


    if(
      Array.isArray(item.topReasons) &&
      item.topReasons.length
    ){

      topText =
        "<p>⚠️ 主な課題：<strong>" +
        item.topReasons.join(" / ") +
        "</strong></p>";

    }


    var html =

      '<div class="history-item">' +

      '<div class="history-top">' +

      "<strong>" +
      item.meName +
      " vs " +
      item.oppName +
      "</strong>" +

      '<span class="' +
      resultClass +
      '">' +
      resultText +
      "</span>" +

      "</div>" +

      '<div class="small">' +
      item.date +
      "</div>" +

      "<div>" +
      item.myWins +
      "-" +
      item.oppWins +
      "</div>" +

      '<div class="small">' +
      gameScores +
      "</div>" +

      '<button class="detail-btn" ' +
      'onclick="toggleDetail(' +
      index +
      ')">' +
      "📊 詳しく見る" +
      "</button>" +

      '<div id="detail-' +
      index +
      '" class="detail hidden">' +

      "<strong>試合結果</strong>" +

      '<div class="row">' +
      "<span>結果</span>" +
      "<strong>" +
      resultText +
      "</strong>" +
      "</div>" +

      '<div class="row">' +
      "<span>ゲームカウント</span>" +
      "<strong>" +
      item.myWins +
      " - " +
      item.oppWins +
      "</strong>" +
      "</div>" +

      "<br>" +

      "<strong>ゲームスコア</strong>" +

      '<div class="small">' +
      gameScores +
      "</div>" +

      "<br>" +

      "<strong>失点理由</strong>" +

      (reasonsText ||
      "<p>失点理由なし</p>") +

      topText +

      "<br>" +

      "<strong>振り返り</strong>" +

      "<p>" +
      "次の試合で、今回の課題を1つ意識してみよう。" +
      "</p>" +

      '<button class="delete-btn" ' +
      'onclick="deleteHistory(' +
      index +
      ')">' +
      "この履歴を削除" +
      "</button>" +

      "</div>" +

      "</div>";


    area.innerHTML += html;

  });

}


/* =========================
詳細表示
========================= */

function toggleDetail(index){

  var element =
    document.getElementById(
      "detail-" + index
    );


  element.classList.toggle("hidden");

}


/* =========================
履歴削除
========================= */

function deleteHistory(index){

  if(
    !confirm(
      "この試合履歴を削除しますか？"
    )
  ){

    return;

  }


  history.splice(index,1);

  save();

  renderHistory();

}


/* =========================
起動
========================= */

load();

</script>

</body>
</html>
