<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卓球試合分析</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:16px 12px 40px;
  background:#f4f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  margin:5px 0 18px;
}

h2{
  font-size:19px;
  margin:0 0 12px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:13px;
  margin-bottom:9px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:16px;
  cursor:pointer;
}

.primary{
  width:100%;
  background:#222;
  color:#fff;
}

.score-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.player{
  flex:1;
  text-align:center;
}

.player-name{
  font-weight:bold;
  font-size:17px;
}

.score{
  font-size:60px;
  font-weight:bold;
  margin:5px 0;
}

.point-btn{
  width:100%;
  background:#eee;
}

.undo{
  width:100%;
  margin-top:12px;
  background:#eee;
}

.finish-btn{
  width:100%;
  margin-top:10px;
  background:#222;
  color:#fff;
}

.game-info{
  text-align:center;
  font-weight:bold;
  font-size:18px;
}

.game-count{
  text-align:center;
  color:#666;
  margin:6px 0 15px;
}

.reason-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.reason-btn{
  background:#eee;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  background:#f4f4f4;
  border-radius:10px;
  padding:12px;
  text-align:center;
}

.stat-title{
  color:#666;
  font-size:13px;
}

.stat-value{
  font-size:21px;
  font-weight:bold;
  margin-top:4px;
}

.hidden{
  display:none!important;
}

.notice{
  text-align:center;
  color:#666;
  font-size:13px;
  margin-bottom:10px;
}

.history-item{
  border:1px solid #ddd;
  border-radius:11px;
  padding:13px;
  margin-bottom:10px;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.win{
  color:#16833a;
  font-weight:bold;
}

.lose{
  color:#c62828;
  font-weight:bold;
}

.small{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.detail{
  background:#f7f7f7;
  border-radius:9px;
  padding:10px;
  margin-top:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid #ddd;
}

.row:last-child{
  border-bottom:0;
}

.detail-btn,
.delete-btn{
  width:100%;
  margin-top:10px;
  background:#eee;
}

.issue{
  background:#fff8dc;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}

.empty{
  text-align:center;
  color:#777;
  padding:15px;
}

.saved{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:8px;
}

.status{
  text-align:center;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏓 卓球 試合分析</h1>

<div class="card">

<h2>選手名</h2>

<input id="meName" placeholder="自分の名前">

<input id="oppName" placeholder="相手の名前">

<button id="startBtn" class="primary">
▶ 試合開始
</button>

<div id="saved" class="saved"></div>

</div>


<div id="matchArea" class="hidden">

<div class="card">

<div class="game-info">
第<span id="gameNumber">1</span>ゲーム
</div>

<div id="gameCount" class="game-count">
ゲームカウント 0 - 0
</div>


<div class="score-area">

<div class="player">

<div id="meDisplay" class="player-name">
自分
</div>

<div id="meScore" class="score">
0
</div>

<button id="mePointBtn" class="point-btn">
＋ 自分の得点
</button>

</div>


<div>−</div>


<div class="player">

<div id="oppDisplay" class="player-name">
相手
</div>

<div id="oppScore" class="score">
0
</div>

<button id="oppPointBtn" class="point-btn">
＋ 相手の得点
</button>

</div>

</div>


<button id="undoBtn" class="undo">
↩ 1点戻す
</button>

<button id="finishBtn" class="finish-btn">
🏁 試合終了
</button>

<div id="status" class="status"></div>

</div>


<div id="reasonArea" class="card hidden">

<h2>失点理由</h2>

<div class="notice">
相手の得点になった理由を選択してください
</div>

<div class="reason-buttons">

<button class="reason-btn" data-reason="サーブミス">
サーブミス
</button>

<button class="reason-btn" data-reason="レシーブミス">
レシーブミス
</button>

<button class="reason-btn" data-reason="攻撃ミス">
攻撃ミス
</button>

<button class="reason-btn" data-reason="守備ミス">
守備ミス
</button>

<button class="reason-btn" data-reason="判断ミス">
判断ミス
</button>

<button class="reason-btn" data-reason="その他">
その他
</button>

</div>

</div>


<div class="card">

<h2>📈 現在の分析</h2>

<div class="stats">

<div class="stat">
<div class="stat-title">
最大連続得点
</div>
<div id="maxWin" class="stat-value">
0
</div>
</div>

<div class="stat">
<div class="stat-title">
最大連続失点
</div>
<div id="maxLose" class="stat-value">
0
</div>
</div>

<div class="stat">
<div class="stat-title">
終盤得点率
</div>
<div id="lateRate" class="stat-value">
-
</div>
</div>

<div class="stat">
<div class="stat-title">
接戦
</div>
<div id="closeGame" class="stat-value">
-
</div>
</div>

</div>

<div id="issue"></div>

</div>


<div class="card">

<h2>📝 失点理由</h2>

<div id="reasonList">
まだ失点していません。
</div>

</div>

</div>


<div class="card">

<h2>📚 試合履歴</h2>

<div id="historyList"></div>

</div>

</div>


<script>

"use strict";


/* =========================
保存キー
========================= */

const STORAGE = "table_tennis_analyzer_v6";


/* =========================
試合データ
========================= */

let me = 0;

let opp = 0;

let game = 1;

let games = [];

let points = [];

let reasons = [];

let matchStarted = false;

let waitingReason = false;

let history = [];


/* =========================
短縮
========================= */

function $(id){
  return document.getElementById(id);
}


/* =========================
保存
========================= */

function save(){

  try{

    const data = {

      meName:$("meName").value,

      oppName:$("oppName").value,

      me:me,

      opp:opp,

      game:game,

      games:games,

      points:points,

      reasons:reasons,

      matchStarted:matchStarted,

      waitingReason:waitingReason,

      history:history

    };

    localStorage.setItem(
      STORAGE,
      JSON.stringify(data)
    );

    $("saved").textContent =
      "💾 自動保存済み";

  }catch(e){

    console.log(e);

  }

}


/* =========================
読み込み
========================= */

function load(){

  try{

    const raw =
      localStorage.getItem(STORAGE);

    if(raw){

      const data =
        JSON.parse(raw);

      $("meName").value =
        data.meName || "";

      $("oppName").value =
        data.oppName || "";

      me =
        Number(data.me) || 0;

      opp =
        Number(data.opp) || 0;

      game =
        Number(data.game) || 1;

      games =
        Array.isArray(data.games)
        ? data.games
        : [];

      points =
        Array.isArray(data.points)
        ? data.points
        : [];

      reasons =
        Array.isArray(data.reasons)
        ? data.reasons
        : [];

      matchStarted =
        data.matchStarted === true;

      waitingReason =
        data.waitingReason === true;

      history =
        Array.isArray(data.history)
        ? data.history
        : [];

    }

  }catch(e){

    console.log(e);

  }


  if(matchStarted){

    $("matchArea")
      .classList
      .remove("hidden");

  }


  if(waitingReason){

    $("reasonArea")
      .classList
      .remove("hidden");

  }


  update();

  renderHistory();

}


/* =========================
試合開始
========================= */

function startMatch(){

  const myName =
    $("meName")
    .value
    .trim();

  const opponentName =
    $("oppName")
    .value
    .trim();


  if(!myName){

    alert(
      "自分の名前を入力してください"
    );

    return;

  }


  if(!opponentName){

    alert(
      "相手の名前を入力してください"
    );

    return;

  }


  me = 0;

  opp = 0;

  game = 1;

  games = [];

  points = [];

  reasons = [];

  matchStarted = true;

  waitingReason = false;


  $("matchArea")
    .classList
    .remove("hidden");


  $("reasonArea")
    .classList
    .add("hidden");


  update();

  save();

}


/* =========================
得点
========================= */

function point(player){

  if(!matchStarted){

    return;

  }


  if(waitingReason){

    alert(
      "先に失点理由を選択してください"
    );

    return;

  }


  if(player === "me"){

    me++;

    points.push({

      player:"me",

      reason:null

    });

  }else{

    opp++;

    points.push({

      player:"opp",

      reason:null

    });

    waitingReason = true;

    $("reasonArea")
      .classList
      .remove("hidden");

  }


  update();

  save();


  /*
  自分の得点なら
  その場でゲーム終了判定
  */

  if(player === "me"){

    checkEnd();

  }

}


/* =========================
失点理由
========================= */

function reason(value){

  if(!waitingReason){

    return;

  }


  const last =
    points[points.length - 1];


  if(
    !last ||
    last.player !== "opp"
  ){

    return;

  }


  last.reason = value;

  reasons.push(value);

  waitingReason = false;


  $("reasonArea")
    .classList
    .add("hidden");


  update();

  save();


  /*
  相手の11点目なら
  理由を選んだ後にゲーム終了
  */

  checkEnd();

}


/* =========================
ゲーム終了判定
========================= */

function checkEnd(){

  if(!matchStarted){

    return;

  }


  if(waitingReason){

    return;

  }


  /*
  11点以上かつ
  2点差以上
  */

  const finished =
    (
      me >= 11 ||
      opp >= 11
    ) &&
    Math.abs(me - opp) >= 2;


  if(!finished){

    return;

  }


  finishGame();

}


/* =========================
ゲーム終了
========================= */

function finishGame(){

  if(!matchStarted){

    return;

  }


  if(waitingReason){

    return;

  }


  /*
  二重登録防止
  */

  const already =
    games.some(function(g){

      return (
        g.game === game &&
        g.me === me &&
        g.opp === opp
      );

    });


  if(already){

    return;

  }


  const winner =
    me > opp
    ? "me"
    : "opp";


  games.push({

    game:game,

    me:me,

    opp:opp,

    winner:winner,

    points:
      points.map(function(p){

        return {

          player:p.player,

          reason:p.reason

        };

      })

  });


  const myWins =
    games.filter(function(g){

      return g.winner === "me";

    }).length;


  const oppWins =
    games.filter(function(g){

      return g.winner === "opp";

    }).length;


  /*
  3ゲーム先取
  */

  if(
    myWins >= 3 ||
    oppWins >= 3
  ){

    finishMatch();

    return;

  }


  const finishedGame = game;


  me = 0;

  opp = 0;

  points = [];

  reasons = [];

  waitingReason = false;

  game++;


  update();

  save();


  alert(
    "第" +
    finishedGame +
    "ゲーム終了！\n\n" +
    "次は第" +
    game +
    "ゲームです。"
  );

}


/* =========================
試合終了
========================= */

function finishMatch(){

  if(!matchStarted){

    return;

  }


  if(waitingReason){

    alert(
      "先に失点理由を選択してください"
    );

    return;

  }


  /*
  現在のゲームが
  まだgamesに入っていない場合、

  11点以上・2点差以上なら
  念のため保存する。
  */

  const currentFinished =
    (
      me >= 11 ||
      opp >= 11
    ) &&
    Math.abs(me - opp) >= 2;


  if(
    currentFinished
  ){

    const already =
      games.some(function(g){

        return (
          g.game === game &&
          g.me === me &&
          g.opp === opp
        );

      });


    if(!already){

      games.push({

        game:game,

        me:me,

        opp:opp,

        winner:
          me > opp
          ? "me"
          : "opp",

        points:
          points.map(function(p){

            return {

              player:p.player,

              reason:p.reason

            };

          })

      });

    }

  }


  /*
  最終ゲームカウント
  */

  const myWins =
    games.filter(function(g){

      return g.winner === "me";

    }).length;


  const oppWins =
    games.filter(function(g){

      return g.winner === "opp";

    }).length;


  const myName =
    $("meName")
    .value
    .trim();


  const opponentName =
    $("oppName")
    .value
    .trim();


  /*
  失点理由集計
  */

  const reasonCount = {};


  games.forEach(function(g){

    if(!Array.isArray(g.points)){

      return;

    }


    g.points.forEach(function(p){

      if(
        p.player === "opp" &&
        p.reason
      ){

        reasonCount[p.reason] =
          (reasonCount[p.reason] || 0) + 1;

      }

    });

  });


  const sorted =
    Object.keys(reasonCount)
    .sort(function(a,b){

      return (
        reasonCount[b] -
        reasonCount[a]
      );

    });


  let topReasons = [];


  if(sorted.length){

    const highest =
      reasonCount[sorted[0]];


    topReasons =
      sorted.filter(function(r){

        return (
          reasonCount[r] ===
          highest
        );

      });

  }


  /*
  履歴データ作成
  */

  const item = {

    id:Date.now(),

    date:
      new Date()
      .toLocaleString("ja-JP"),

    meName:myName,

    oppName:opponentName,

    myWins:myWins,

    oppWins:oppWins,

    winner:
      myWins > oppWins
      ? "me"
      : "opp",

    games:
      JSON.parse(
        JSON.stringify(games)
      ),

    reasons:reasonCount,

    topReasons:topReasons

  };


  /*
  履歴に追加
  */

  history.unshift(item);


  /*
  ここで試合を終了状態にする
  */

  matchStarted = false;

  waitingReason = false;


  $("matchArea")
    .classList
    .add("hidden");


  $("reasonArea")
    .classList
    .add("hidden");


  /*
  先に保存
  */

  save();

  renderHistory();


  /*
  試合終了を表示
  */

  alert(
    "🏓 試合終了！\n\n" +

    myName +
    " " +
    myWins +
    " - " +
    oppWins +
    " " +
    opponentName +

    "\n\n📚 試合履歴に保存しました。"
  );


  /*
  次の試合のためにリセット
  */

  me = 0;

  opp = 0;

  game = 1;

  games = [];

  points = [];

  reasons = [];


  update();

  save();

}


/* =========================
1点戻す
========================= */

function undo(){

  if(!matchStarted){

    return;

  }


  if(points.length === 0){

    alert(
      "戻せる点がありません"
    );

    return;

  }


  const last =
    points.pop();


  if(last.player === "me"){

    me--;

  }else{

    opp--;


    if(last.reason){

      const index =
        reasons.lastIndexOf(
          last.reason
        );


      if(index !== -1){

        reasons.splice(
          index,
          1
        );

      }

    }

  }


  waitingReason = false;


  $("reasonArea")
    .classList
    .add("hidden");


  update();

  save();

}


/* =========================
統計
========================= */

function calculateStats(){

  let win = 0;

  let lose = 0;

  let maxWin = 0;

  let maxLose = 0;


  points.forEach(function(p){

    if(p.player === "me"){

      win++;

      lose = 0;

      if(win > maxWin){

        maxWin = win;

      }

    }else{

      lose++;

      win = 0;

      if(lose > maxLose){

        maxLose = lose;

      }

    }

  });


  return {

    maxWin:maxWin,

    maxLose:maxLose

  };

}


/* =========================
終盤得点率
========================= */

function getLateRate(){

  if(points.length === 0){

    return "-";

  }


  let my = 0;

  let op = 0;

  let total = 0;

  let mine = 0;


  points.forEach(function(p){

    if(p.player === "me"){

      my++;

    }else{

      op++;

    }


    if(my >= 7 || op >= 7){

      total++;


      if(p.player === "me"){

        mine++;

      }

    }

  });


  if(total === 0){

    return "-";

  }


  return (
    Math.round(
      mine / total * 100
    ) +
    "%"
  );

}


/* =========================
接戦
========================= */

function getCloseGame(){

  if(points.length === 0){

    return "-";

  }


  let my = 0;

  let op = 0;

  let total = 0;

  let close = 0;


  points.forEach(function(p){

    if(p.player === "me"){

      my++;

    }else{

      op++;

    }


    if(my >= 7 || op >= 7){

      total++;


      if(
        Math.abs(my - op) <= 2
      ){

        close++;

      }

    }

  });


  if(total === 0){

    return "-";

  }


  return (
    close / total >= 0.5
    ? "接戦"
    : "通常"
  );

}


/* =========================
画面更新
========================= */

function update(){

  $("meScore")
    .textContent = me;


  $("oppScore")
    .textContent = opp;


  $("gameNumber")
    .textContent = game;


  $("meDisplay")
    .textContent =
      $("meName")
      .value
      .trim() || "自分";


  $("oppDisplay")
    .textContent =
      $("oppName")
      .value
      .trim() || "相手";


  const myWins =
    games.filter(function(g){

      return g.winner === "me";

    }).length;


  const oppWins =
    games.filter(function(g){

      return g.winner === "opp";

    }).length;


  $("gameCount")
    .textContent =
      "ゲームカウント " +
      myWins +
      " - " +
      oppWins;


  const stats =
    calculateStats();


  $("maxWin")
    .textContent =
      stats.maxWin;


  $("maxLose")
    .textContent =
      stats.maxLose;


  $("lateRate")
    .textContent =
      getLateRate();


  $("closeGame")
    .textContent =
      getCloseGame();


  $("status")
    .textContent =
      matchStarted
      ? "試合進行中"
      : "";


  renderReasons();

  renderIssue();

}


/* =========================
失点理由表示
========================= */

function renderReasons(){

  if(reasons.length === 0){

    $("reasonList")
      .textContent =
      "まだ失点していません。";

    return;

  }


  const count = {};


  reasons.forEach(function(r){

    count[r] =
      (count[r] || 0) + 1;

  });


  $("reasonList")
    .innerHTML =
      Object.keys(count)
      .sort(function(a,b){

        return (
          count[b] -
          count[a]
        );

      })
      .map(function(r){

        return (
          '<div class="row">' +
          '<span>' +
          escapeHTML(r) +
          '</span>' +
          '<strong>' +
          count[r] +
          '回</strong>' +
          '</div>'
        );

      })
      .join("");

}


/* =========================
今回の課題
========================= */

function renderIssue(){

  if(reasons.length === 0){

    $("issue")
      .innerHTML = "";

    return;

  }


  const count = {};


  reasons.forEach(function(r){

    count[r] =
      (count[r] || 0) + 1;

  });


  const max =
    Math.max(
      ...Object.values(count)
    );


  const top =
    Object.keys(count)
    .filter(function(r){

      return count[r] === max;

    });


  $("issue")
    .innerHTML =
      '<div class="issue">' +
      '<strong>🎯 今回の課題</strong>' +
      '<p>' +
      top
      .map(escapeHTML)
      .join("・") +
      "が" +
      max +
      "回で最も多い失点理由です。" +
      '</p>' +
      '</div>';

}


/* =========================
HTML安全処理
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
履歴表示
========================= */

function renderHistory(){

  if(
    !Array.isArray(history) ||
    history.length === 0
  ){

    $("historyList")
      .innerHTML =
      '<div class="empty">' +
      'まだ試合履歴がありません。' +
      '</div>';

    return;

  }


  let html = "";


  history.forEach(function(item){

    const win =
      item.winner === "me";


    let gamesText = "";


    if(
      Array.isArray(item.games)
    ){

      gamesText =
        item.games
        .map(function(g){

          return (
            g.me +
            "-" +
            g.opp
          );

        })
        .join(" / ");

    }


    html +=

      '<div class="history-item">' +

      '<div class="history-top">' +

      '<div>' +

      '<strong>' +
      escapeHTML(item.meName) +
      '</strong>' +

      ' vs ' +

      '<strong>' +
      escapeHTML(item.oppName) +
      '</strong>' +

      '</div>' +

      '<div class="' +
      (win ? "win" : "lose") +
      '">' +

      (win ? "勝利" : "敗北") +

      '</div>' +

      '</div>' +

      '<div>' +
      'ゲームカウント ' +
      item.myWins +
      ' - ' +
      item.oppWins +
      '</div>' +

      '<div class="small">' +
      escapeHTML(item.date) +
      '</div>' +

      '<div class="small">' +
      'ゲーム：' +
      escapeHTML(gamesText) +
      '</div>' +

      '<button class="detail-btn" ' +
      'data-detail="' +
      item.id +
      '">' +

      '📊 詳しく見る' +

      '</button>' +

      '<div id="detail' +
      item.id +
      '" class="detail hidden">' +

      makeDetail(item) +

      '</div>' +

      '</div>';

  });


  $("historyList")
    .innerHTML = html;

}


/* =========================
詳細
========================= */

function makeDetail(item){

  let html =
    "<h3>ゲーム結果</h3>";


  if(
    Array.isArray(item.games)
  ){

    item.games.forEach(function(g){

      html +=

        '<div class="row">' +

        '<span>' +
        '第' +
        g.game +
        'ゲーム' +
        '</span>' +

        '<strong>' +
        g.me +
        " - " +
        g.opp +
        '</strong>' +

        '</div>';

    });

  }


  html +=
    "<h3>失点理由</h3>";


  const r =
    item.reasons || {};


  const keys =
    Object.keys(r);


  if(keys.length === 0){

    html +=
      "<p>記録なし</p>";

  }else{

    keys
    .sort(function(a,b){

      return r[b] - r[a];

    })
    .forEach(function(k){

      html +=

        '<div class="row">' +

        '<span>' +
        escapeHTML(k) +
        '</span>' +

        '<strong>' +
        r[k] +
        '回</strong>' +

        '</div>';

    });

  }


  if(
    Array.isArray(item.topReasons) &&
    item.topReasons.length
  ){

    html +=

      '<div class="issue">' +

      '<strong>🎯 試合の課題</strong>' +

      '<p>' +

      item.topReasons
      .map(escapeHTML)
      .join("・") +

      'が主な失点理由でした。</p>' +

      '</div>';

  }


  html +=

    '<button class="delete-btn" ' +
    'data-delete="' +
    item.id +
    '">' +

    '🗑 この試合を削除' +

    '</button>';


  return html;

}


/* =========================
イベント設定
========================= */


/*
試合開始
*/

$("startBtn")
  .addEventListener(
    "click",
    startMatch
  );


/*
自分の得点
*/

$("mePointBtn")
  .addEventListener(
    "click",
    function(){

      point("me");

    }
  );


/*
相手の得点
*/

$("oppPointBtn")
  .addEventListener(
    "click",
    function(){

      point("opp");

    }
  );


/*
1点戻す
*/

$("undoBtn")
  .addEventListener(
    "click",
    undo
  );


/*
試合終了
*/

$("finishBtn")
  .addEventListener(
    "click",
    function(){

      finishMatch();

    }
  );


/*
失点理由
*/

document
  .querySelectorAll(".reason-btn")
  .forEach(function(btn){

    btn.addEventListener(
      "click",
      function(){

        reason(
          btn.dataset.reason
        );

      }
    );

  });


/*
履歴
*/

$("historyList")
  .addEventListener(
    "click",
    function(e){

      const detail =
        e.target.closest(
          "[data-detail]"
        );


      if(detail){

        const id =
          detail.dataset.detail;

        const element =
          $("detail" + id);

        if(element){

          element
            .classList
            .toggle("hidden");

        }

        return;

      }


      const del =
        e.target.closest(
          "[data-delete]"
        );


      if(del){

        if(
          confirm(
            "この試合履歴を削除しますか？"
          )
        ){

          history =
            history.filter(
              function(item){

                return (
                  String(item.id) !==
                  String(del.dataset.delete)
                );

              }
            );

          save();

          renderHistory();

        }

      }

    }
  );


/*
名前変更
*/

$("meName")
  .addEventListener(
    "input",
    function(){

      update();

      save();

    }
  );


$("oppName")
  .addEventListener(
    "input",
    function(){

      update();

      save();

    }
  );


/*
ページを閉じる前に保存
*/

window.addEventListener(
  "pagehide",
  save
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.visibilityState ===
      "hidden"
    ){

      save();

    }

  }
);


/* =========================
起動
========================= */

load();

</script>
