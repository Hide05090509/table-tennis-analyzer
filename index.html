<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>卓球試合分析</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px 12px 40px;
  background:#f4f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  margin:5px 0 20px;
}

h2{
  font-size:19px;
  margin:0 0 14px;
}

h3{
  margin:12px 0 8px;
  font-size:16px;
}

.card{
  background:#fff;
  border-radius:15px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:13px;
  margin-bottom:9px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px;
  font-size:16px;
  cursor:pointer;
}

.primary{
  width:100%;
  background:#222;
  color:#fff;
}

.score-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.player{
  flex:1;
  text-align:center;
}

.player-name{
  font-weight:bold;
  font-size:17px;
}

.score{
  font-size:60px;
  font-weight:bold;
  margin:5px 0;
}

.point-btn{
  width:100%;
  background:#eee;
}

.undo{
  width:100%;
  margin-top:12px;
  background:#eee;
}

.game-info{
  text-align:center;
  font-weight:bold;
  font-size:18px;
  margin-bottom:8px;
}

.game-count{
  text-align:center;
  color:#666;
  margin-bottom:15px;
}

.reason-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.reason-btn{
  background:#eee;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  background:#f4f4f4;
  border-radius:10px;
  padding:12px;
  text-align:center;
}

.stat-title{
  color:#666;
  font-size:13px;
}

.stat-value{
  font-size:21px;
  font-weight:bold;
  margin-top:4px;
}

.hidden{
  display:none;
}

.notice{
  text-align:center;
  color:#666;
  font-size:13px;
  margin-bottom:10px;
}

.history-item{
  border:1px solid #ddd;
  border-radius:11px;
  padding:13px;
  margin-bottom:10px;
}

.history-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.win{
  color:#16833a;
  font-weight:bold;
}

.lose{
  color:#c62828;
  font-weight:bold;
}

.small{
  color:#777;
  font-size:13px;
  margin-top:5px;
}

.detail{
  background:#f7f7f7;
  border-radius:9px;
  padding:10px;
  margin-top:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
  border-bottom:1px solid #ddd;
}

.row:last-child{
  border-bottom:0;
}

.detail-btn{
  width:100%;
  margin-top:10px;
  background:#eee;
}

.delete-btn{
  margin-top:10px;
  background:#eee;
  font-size:13px;
}

.issue{
  background:#fff8dc;
  padding:12px;
  border-radius:10px;
  margin-top:12px;
}

.empty{
  text-align:center;
  color:#777;
  padding:15px;
}

.saved{
  text-align:center;
  color:#777;
  font-size:12px;
  margin-top:8px;
}

.result{
  text-align:center;
  font-size:22px;
  font-weight:bold;
  margin:10px 0;
}
</style>
</head>

<body>

<div class="container">

<h1>🏓 卓球 試合分析</h1>

<!-- 選手名 -->
<div class="card">

<h2>選手名</h2>

<input
  id="meName"
  placeholder="自分の名前"
>

<input
  id="oppName"
  placeholder="相手の名前"
>

<button
  class="primary"
  onclick="startMatch()"
>
▶ 試合開始
</button>

<div
  id="saved"
  class="saved"
></div>

</div>


<!-- 試合エリア -->
<div
  id="matchArea"
  class="hidden"
>

<div class="card">

<div class="game-info">
第<span id="gameNumber">1</span>ゲーム
</div>

<div
  id="gameCount"
  class="game-count"
>
ゲームカウント 0 - 0
</div>

<div class="score-area">

<div class="player">

<div
  id="meDisplay"
  class="player-name"
>
自分
</div>

<div
  id="meScore"
  class="score"
>
0
</div>

<button
  class="point-btn"
  onclick="point('me')"
>
＋ 自分の得点
</button>

</div>

<div>−</div>

<div class="player">

<div
  id="oppDisplay"
  class="player-name"
>
相手
</div>

<div
  id="oppScore"
  class="score"
>
0
</div>

<button
  class="point-btn"
  onclick="point('opp')"
>
＋ 相手の得点
</button>

</div>

</div>

<button
  class="undo"
  onclick="undo()"
>
↩ 1点戻す
</button>

</div>


<!-- 失点理由 -->
<div
  id="reasonArea"
  class="card hidden"
>

<h2>失点理由</h2>

<div class="notice">
相手の得点になった理由を選択してください
</div>

<div class="reason-buttons">

<button
  class="reason-btn"
  onclick="reason('サーブミス')"
>
サーブミス
</button>

<button
  class="reason-btn"
  onclick="reason('レシーブミス')"
>
レシーブミス
</button>

<button
  class="reason-btn"
  onclick="reason('攻撃ミス')"
>
攻撃ミス
</button>

<button
  class="reason-btn"
  onclick="reason('守備ミス')"
>
守備ミス
</button>

<button
  class="reason-btn"
  onclick="reason('判断ミス')"
>
判断ミス
</button>

<button
  class="reason-btn"
  onclick="reason('その他')"
>
その他
</button>

</div>

</div>


<!-- 現在の分析 -->
<div class="card">

<h2>📈 現在の分析</h2>

<div class="stats">

<div class="stat">
<div class="stat-title">
最大連続得点
</div>
<div
  id="maxWin"
  class="stat-value"
>
0
</div>
</div>

<div class="stat">
<div class="stat-title">
最大連続失点
</div>
<div
  id="maxLose"
  class="stat-value"
>
0
</div>
</div>

<div class="stat">
<div class="stat-title">
終盤得点率
</div>
<div
  id="lateRate"
  class="stat-value"
>
-
</div>
</div>

<div class="stat">
<div class="stat-title">
接戦
</div>
<div
  id="closeGame"
  class="stat-value"
>
-
</div>
</div>

</div>

<div id="issue"></div>

</div>


<!-- 失点理由 -->
<div class="card">

<h2>📝 失点理由</h2>

<div id="reasonList">
まだ失点していません。
</div>

</div>

</div>


<!-- 試合履歴 -->
<div class="card">

<h2>📚 試合履歴</h2>

<div id="historyList">
</div>

</div>

</div>


<script>

/* ==================================================
   基本データ
================================================== */

var me = 0;
var opp = 0;

var game = 1;

var games = [];

var points = [];

var reasons = [];

var maxWin = 0;
var maxLose = 0;

var waitingReason = false;

var matchStarted = false;

var history = [];

var STORAGE = "table_tennis_analyzer_v3";


/* ==================================================
   保存
================================================== */

function save(){

  try{

    var meNameElement =
      document.getElementById("meName");

    var oppNameElement =
      document.getElementById("oppName");

    var data = {

      meName:
        meNameElement
        ? meNameElement.value
        : "",

      oppName:
        oppNameElement
        ? oppNameElement.value
        : "",

      me:me,

      opp:opp,

      game:game,

      games:games,

      points:points,

      reasons:reasons,

      maxWin:maxWin,

      maxLose:maxLose,

      matchStarted:matchStarted,

      history:history

    };

    localStorage.setItem(
      STORAGE,
      JSON.stringify(data)
    );

    var saved =
      document.getElementById("saved");

    if(saved){
      saved.textContent =
        "💾 自動保存済み";
    }

  }catch(e){

    console.log("保存エラー:",e);

  }

}


/* ==================================================
   読み込み
================================================== */

function load(){

  try{

    var saved =
      localStorage.getItem(STORAGE);

    if(saved){

      var data =
        JSON.parse(saved);

      document.getElementById("meName").value =
        data.meName || "";

      document.getElementById("oppName").value =
        data.oppName || "";

      me =
        Number(data.me) || 0;

      opp =
        Number(data.opp) || 0;

      game =
        Number(data.game) || 1;

      games =
        Array.isArray(data.games)
        ? data.games
        : [];

      points =
        Array.isArray(data.points)
        ? data.points
        : [];

      reasons =
        Array.isArray(data.reasons)
        ? data.reasons
        : [];

      maxWin =
        Number(data.maxWin) || 0;

      maxLose =
        Number(data.maxLose) || 0;

      matchStarted =
        data.matchStarted === true;

      history =
        Array.isArray(data.history)
        ? data.history
        : [];

    }

  }catch(e){

    console.log("読み込みエラー:",e);

    history = [];

  }

  renderHistory();

  if(matchStarted){

    document
      .getElementById("matchArea")
      .classList
      .remove("hidden");

  }

  update();

}


/* ==================================================
   試合開始
================================================== */

function startMatch(){

  var myName =
    document
      .getElementById("meName")
      .value
      .trim();

  var opponentName =
    document
      .getElementById("oppName")
      .value
      .trim();

  if(!myName){

    alert(
      "自分の名前を入力してください"
    );

    return;

  }

  if(!opponentName){

    alert(
      "相手の名前を入力してください"
    );

    return;

  }

  me = 0;

  opp = 0;

  game = 1;

  games = [];

  points = [];

  reasons = [];

  maxWin = 0;

  maxLose = 0;

  waitingReason = false;

  matchStarted = true;

  document
    .getElementById("matchArea")
    .classList
    .remove("hidden");

  document
    .getElementById("reasonArea")
    .classList
    .add("hidden");

  update();

  save();

}


/* ==================================================
   得点
================================================== */

function point(player){

  if(!matchStarted){
    return;
  }

  if(waitingReason){

    alert(
      "先に失点理由を選択してください"
    );

    return;

  }


  /* 自分の得点 */

  if(player === "me"){

    me++;

    points.push({

      player:"me",

      reason:null

    });

  }


  /* 相手の得点 */

  else{

    opp++;

    points.push({

      player:"opp",

      reason:null

    });

    waitingReason = true;

    document
      .getElementById("reasonArea")
      .classList
      .remove("hidden");

  }


  calculateStats();

  update();

  save();


  /*
    自分の得点の場合は
    その場でゲーム終了判定
  */

  if(player === "me"){

    checkEnd();

  }

}


/* ==================================================
   失点理由
================================================== */

function reason(value){

  if(!waitingReason){
    return;
  }

  var last =
    points[points.length - 1];

  if(
    last &&
    last.player === "opp"
  ){

    last.reason = value;

    reasons.push(value);

  }

  waitingReason = false;

  document
    .getElementById("reasonArea")
    .classList
    .add("hidden");

  calculateStats();

  update();

  save();

  /*
    相手の得点の場合は
    理由を選んだあとに終了判定
  */

  checkEnd();

}


/* ==================================================
   ゲーム終了判定
================================================== */

function checkEnd(){

  /*
    卓球のゲーム終了条件

    ・11点以上
    ・2点差以上

    例：
    11-9 → 終了
    11-10 → 継続
    12-10 → 終了
    12-11 → 継続
    13-11 → 終了
  */

  if(
    (me >= 11 || opp >= 11) &&
    Math.abs(me - opp) >= 2
  ){

    finishGame();

  }

}


/* ==================================================
   ゲーム終了
================================================== */

function finishGame(){

  if(!matchStarted){
    return;
  }


  /*
    ゲームの勝者
  */

  var winner =
    me > opp
    ? "me"
    : "opp";


  /*
    終了したゲームを保存
  */

  games.push({

    game:game,

    me:me,

    opp:opp,

    winner:winner,

    points:
      points.map(
        function(p){

          return {

            player:p.player,

            reason:p.reason

          };

        }
      )

  });


  /*
    現在のゲームカウント
  */

  var myWins =
    games.filter(
      function(g){

        return g.winner === "me";

      }
    ).length;


  var oppWins =
    games.filter(
      function(g){

        return g.winner === "opp";

      }
    ).length;


  /*
    ★重要
    3ゲーム先取なら即試合終了
  */

  if(
    myWins >= 3 ||
    oppWins >= 3
  ){

    finishMatch();

    return;

  }


  /*
    まだ試合が続く場合
    次のゲームへ
  */

  var finishedGame = game;

  me = 0;

  opp = 0;

  points = [];

  reasons = [];

  maxWin = 0;

  maxLose = 0;

  waitingReason = false;

  game++;


  update();

  save();


  alert(
    "第" +
    finishedGame +
    "ゲーム終了！\n\n" +
    "次は第" +
    game +
    "ゲームです。"
  );

}


/* ==================================================
   試合終了
================================================== */

function finishMatch(){

  if(!matchStarted){
    return;
  }


  var myName =
    document
      .getElementById("meName")
      .value
      .trim();

  var opponentName =
    document
      .getElementById("oppName")
      .value
      .trim();


  /*
    ゲーム勝利数
  */

  var myWins =
    games.filter(
      function(g){

        return g.winner === "me";

      }
    ).length;


  var oppWins =
    games.filter(
      function(g){

        return g.winner === "opp";

      }
    ).length;


  /*
    失点理由集計
  */

  var reasonCount = {};


  games.forEach(
    function(g){

      if(
        !Array.isArray(g.points)
      ){

        return;

      }

      g.points.forEach(
        function(p){

          if(
            p.player === "opp" &&
            p.reason
          ){

            reasonCount[p.reason] =
              (reasonCount[p.reason] || 0) + 1;

          }

        }
      );

    }
  );


  /*
    多い失点理由
  */

  var sorted =
    Object.keys(reasonCount)
    .sort(
      function(a,b){

        return (
          reasonCount[b] -
          reasonCount[a]
        );

      }
    );


  var top = [];


  if(sorted.length){

    var highest =
      reasonCount[sorted[0]];

    top =
      sorted.filter(
        function(r){

          return (
            reasonCount[r] ===
            highest
          );

        }
      );

  }


  /*
    試合履歴データ
  */

  var item = {

    id:Date.now(),

    date:
      new Date()
      .toLocaleString("ja-JP"),

    meName:myName,

    oppName:opponentName,

    myWins:myWins,

    oppWins:oppWins,

    winner:
      myWins > oppWins
      ? "me"
      : "opp",

    games:
      JSON.parse(
        JSON.stringify(games)
      ),

    reasons:reasonCount,

    topReasons:top

  };


  /*
    履歴の先頭に追加
  */

  history.unshift(item);


  /*
    ★履歴を保存
  */

  save();


  /*
    画面にも表示
  */

  renderHistory();


  /*
    結果を表示
  */

  alert(
    "試合終了！\n\n" +
    myName +
    " " +
    myWins +
    " - " +
    oppWins +
    " " +
    opponentName +
    "\n\n" +
    "📚 試合履歴に保存しました。"
  );


  /*
    次の試合に備えて
    現在の試合データをリセット
  */

  me = 0;

  opp = 0;

  game = 1;

  games = [];

  points = [];

  reasons = [];

  maxWin = 0;

  maxLose = 0;

  waitingReason = false;

  matchStarted = false;


  /*
    試合画面を隠す
  */

  document
    .getElementById("matchArea")
    .classList
    .add("hidden");


  /*
    リセット状態も保存
  */

  save();

}


/* ==================================================
   1点戻す
================================================== */

function undo(){

  if(!matchStarted){
    return;
  }

  if(points.length === 0){

    alert(
      "戻せる点がありません"
    );

    return;

  }


  /*
    最後の得点を取り出す
  */

  var last =
    points.pop();


  /*
    自分の得点だった場合
  */

  if(last.player === "me"){

    if(me > 0){
      me--;
    }

  }


  /*
    相手の得点だった場合
  */

  else{

    if(opp > 0){
      opp--;
    }


    /*
      対応する失点理由も削除
    */

    if(last.reason){

      var index =
        reasons.lastIndexOf(
          last.reason
        );

      if(index !== -1){

        reasons.splice(
          index,
          1
        );

      }

    }

  }


  waitingReason = false;


  document
    .getElementById("reasonArea")
    .classList
    .add("hidden");


  calculateStats();

  update();

  save();

}


/* ==================================================
   統計
================================================== */

function calculateStats(){

  var win = 0;

  var lose = 0;

  maxWin = 0;

  maxLose = 0;


  points.forEach(
    function(p){

      if(p.player === "me"){

        win++;

        lose = 0;

        if(win > maxWin){

          maxWin = win;

        }

      }

      else{

        lose++;

        win = 0;

        if(lose > maxLose){

          maxLose = lose;

        }

      }

    }
  );

}


/* ==================================================
   終盤得点率
================================================== */

function lateRate(){

  if(points.length === 0){

    return "-";

  }


  var my = 0;

  var op = 0;

  var total = 0;

  var mine = 0;


  points.forEach(
    function(p){

      if(p.player === "me"){

        my++;

      }

      else{

        op++;

      }


      /*
        7点以上になった後の
        得点を終盤として計算
      */

      if(my >= 7 || op >= 7){

        total++;

        if(p.player === "me"){

          mine++;

        }

      }

    }
  );


  if(total === 0){

    return "-";

  }


  return Math.round(
    mine / total * 100
  ) + "%";

}


/* ==================================================
   接戦
================================================== */

function closeGame(){

  if(points.length === 0){

    return "-";

  }


  var my = 0;

  var op = 0;

  var total = 0;

  var close = 0;


  points.forEach(
    function(p){

      if(p.player === "me"){

        my++;

      }

      else{

        op++;

      }


      if(my >= 7 || op >= 7){

        total++;

        if(
          Math.abs(my - op) <= 2
        ){

          close++;

        }

      }

    }
  );


  if(total === 0){

    return "-";

  }


  return (
    close / total >= 0.5
  )
  ? "接戦"
  : "通常";

}


/* ==================================================
   画面更新
================================================== */

function update(){

  document
    .getElementById("meScore")
    .textContent = me;


  document
    .getElementById("oppScore")
    .textContent = opp;


  document
    .getElementById("gameNumber")
    .textContent = game;


  document
    .getElementById("meDisplay")
    .textContent =
      document
        .getElementById("meName")
        .value
      || "自分";


  document
    .getElementById("oppDisplay")
    .textContent =
      document
        .getElementById("oppName")
        .value
      || "相手";


  /*
    ゲームカウント
  */

  var myWins =
    games.filter(
      function(g){

        return g.winner === "me";

      }
    ).length;


  var oppWins =
    games.filter(
      function(g){

        return g.winner === "opp";

      }
    ).length;


  document
    .getElementById("gameCount")
    .textContent =
      "ゲームカウント " +
      myWins +
      " - " +
      oppWins;


  document
    .getElementById("maxWin")
    .textContent =
      maxWin;


  document
    .getElementById("maxLose")
    .textContent =
      maxLose;


  document
    .getElementById("lateRate")
    .textContent =
      lateRate();


  document
    .getElementById("closeGame")
    .textContent =
      closeGame();


  renderReasons();

  renderIssue();

}


/* ==================================================
   失点理由表示
================================================== */

function renderReasons(){

  var element =
    document.getElementById(
      "reasonList"
    );


  if(
    reasons.length === 0
  ){

    element.textContent =
      "まだ失点していません。";

    return;

  }


  var count = {};


  reasons.forEach(
    function(r){

      count[r] =
        (count[r] || 0) + 1;

    }
  );


  var html = "";


  Object.keys(count)
    .sort(
      function(a,b){

        return (
          count[b] -
          count[a]
        );

      }
    )
    .forEach(
      function(r){

        html +=
          '<div class="row">' +
          '<span>' +
          escapeHTML(r) +
          '</span>' +
          '<strong>' +
          count[r] +
          '回</strong>' +
          '</div>';

      }
    );


  element.innerHTML = html;

}


/* ==================================================
   課題
================================================== */

function renderIssue(){

  var element =
    document.getElementById(
      "issue"
    );


  if(
    reasons.length === 0
  ){

    element.innerHTML = "";

    return;

  }


  var count = {};


  reasons.forEach(
    function(r){

      count[r] =
        (count[r] || 0) + 1;

    }
  );


  var max = 0;


  Object.keys(count)
    .forEach(
      function(r){

        if(count[r] > max){

          max = count[r];

        }

      }
    );


  var top =
    Object.keys(count)
      .filter(
        function(r){

          return (
            count[r] === max
          );

        }
      );


  element.innerHTML =
    '<div class="issue">' +
    '<strong>🎯 今回の課題</strong>' +
    '<p>' +
    top
      .map(escapeHTML)
      .join("・") +
    'が' +
    max +
    '回で最も多い失点理由です。' +
    '</p>' +
    '</div>';

}


/* ==================================================
   試合履歴
================================================== */

function renderHistory(){

  var element =
    document.getElementById(
      "historyList"
    );


  if(
    !Array.isArray(history) ||
    history.length === 0
  ){

    element.innerHTML =
      '<div class="empty">' +
      'まだ試合履歴がありません。' +
      '</div>';

    return;

  }


  var html = "";


  history.forEach(
    function(item){

      var result =
        item.winner === "me"
        ? "勝利"
        : "敗北";


      var cls =
        item.winner === "me"
        ? "win"
        : "lose";


      var gamesText = "";


      if(
        Array.isArray(item.games)
      ){

        gamesText =
          item.games
            .map(
              function(g){

                return (
                  g.me +
                  "-" +
                  g.opp
                );

              }
            )
            .join(" / ");

      }


      html +=
        '<div class="history-item">' +

        '<div class="history-top">' +

        '<div>' +

        '<strong>' +
        escapeHTML(
          item.meName
        ) +
        '</strong>' +

        ' vs ' +

        '<strong>' +
        escapeHTML(
          item.oppName
        ) +
        '</strong>' +

        '</div>' +

        '<div class="' +
        cls +
        '">' +
        result +
        '</div>' +

        '</div>' +

        '<div>' +
        'ゲームカウント ' +
        item.myWins +
        ' - ' +
        item.oppWins +
        '</div>' +

        '<div class="small">' +
        escapeHTML(item.date) +
        '</div>' +

        '<div class="small">' +
        'ゲーム：' +
        escapeHTML(gamesText) +
        '</div>' +

        '<button ' +
        'class="detail-btn" ' +
        'onclick="toggleDetail(' +
        Number(item.id) +
        ')">' +
        '📊 詳しく見る' +
        '</button>' +

        '<div id="detail' +
        Number(item.id) +
        '" ' +
        'class="detail hidden">' +

        makeDetail(item) +

        '</div>' +

        '</div>';

    }
  );


  element.innerHTML = html;

}


/* ==================================================
   履歴詳細
================================================== */

function makeDetail(item){

  var html = "";


  html +=
    "<h3>ゲーム結果</h3>";


  if(
    Array.isArray(item.games) &&
    item.games.length
  ){

    item.games.forEach(
      function(g){

        html +=
          '<div class="row">' +

          '<span>' +
          '第' +
          g.game +
          'ゲーム' +
          '</span>' +

          '<strong>' +
          g.me +
          " - " +
          g.opp +
          '</strong>' +

          '</div>';

      }
    );

  }


  html +=
    "<h3>失点理由</h3>";


  var reasonsObj =
    item.reasons || {};


  var keys =
    Object.keys(reasonsObj);


  if(keys.length === 0){

    html +=
      "<p>記録なし</p>";

  }

  else{

    keys.sort(
      function(a,b){

        return (
          reasonsObj[b] -
          reasonsObj[a]
        );

      }
    );


    keys.forEach(
      function(r){

        html +=
          '<div class="row">' +

          '<span>' +
          escapeHTML(r) +
          '</span>' +

          '<strong>' +
          reasonsObj[r] +
          '回' +
          '</strong>' +

          '</div>';

      }
    );

  }


  if(
    Array.isArray(item.topReasons) &&
    item.topReasons.length
  ){

    html +=
      '<div class="issue">' +

      '<strong>🎯 試合の課題</strong>' +

      '<p>' +

      item.topReasons
        .map(escapeHTML)
        .join("・") +

      'が主な失点理由でした。' +

      '</p>' +

      '</div>';

  }


  html +=
    '<button ' +
    'class="delete-btn" ' +
    'onclick="deleteHistory(' +
    Number(item.id) +
    ')">' +
    '🗑 この試合を削除' +
    '</button>';


  return html;

}


/* ==================================================
   詳細開閉
================================================== */

function toggleDetail(id){

  var element =
    document.getElementById(
      "detail" + id
    );


  if(element){

    element.classList.toggle(
      "hidden"
    );

  }

}


/* ==================================================
   履歴削除
================================================== */

function deleteHistory(id){

  if(
    !confirm(
      "この試合履歴を削除しますか？"
    )
  ){

    return;

  }


  history =
    history.filter(
      function(item){

        return (
          Number(item.id) !==
          Number(id)
        );

      }
    );


  save();

  renderHistory();

}


/* ==================================================
   HTML安全処理
================================================== */

function escapeHTML(value){

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

   名前変更時保存
================================================== */

document
  .getElementById("meName")
  .addEventListener(
    "input",
    function(){

      update();

      save();

    }
  );


document
  .getElementById("oppName")
  .addEventListener(
    "input",
    function(){

      update();

      save();

    }
  );


/* ==================================================
   アプリ終了時保存
================================================== */

window.addEventListener(
  "pagehide",
  function(){

    save();

  }
);


document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.visibilityState ===
      "hidden"
    ){

      save();

    }

  }
);


/* ==================================================
   起動
================================================== */

load();
