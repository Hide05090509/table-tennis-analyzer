<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卓球試合分析</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5f7;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  color:#222;
}

main{
  max-width:600px;
  margin:auto;
  padding:16px;
}

h1{text-align:center}

.card{
  background:white;
  border-radius:18px;
  padding:18px;
  margin:14px 0;
  box-shadow:0 3px 12px #0001;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  margin:6px 0 12px;
}

.score{
  text-align:center;
  font-size:64px;
  font-weight:800;
  margin:15px;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:16px;
  font-size:17px;
  font-weight:bold;
  flex:1;
}

.me{
  background:#222;
  color:white;
}

.opp{
  background:#ddd;
}

.secondary{
  background:#eee;
  width:100%;
  margin-top:10px;
}

.reasonButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.reasonButtons button{
  padding:12px;
  font-size:14px;
}

.green{
  background:#e8f5e9;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
}

.yellow{
  background:#fff4ce;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
}

.history{
  line-height:1.8;
  max-height:220px;
  overflow:auto;
}

.stat{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:9px 0;
}

#reasonArea{
  display:none;
  margin-top:15px;
  padding:14px;
  background:#f7f7f7;
  border-radius:12px;
}

.challenge{
  background:#ffe5e5;
  padding:16px;
  border-radius:12px;
  margin-top:12px;
  font-size:17px;
}

.saved{
  text-align:center;
  font-size:13px;
  color:#555;
  margin-top:8px;
}

.matchResult{
  padding:14px;
  border:1px solid #eee;
  border-radius:12px;
  margin-top:10px;
  background:#fafafa;
}

.detail{
  display:none;
  margin-top:12px;
  padding:14px;
  background:#f3f5f7;
  border-radius:12px;
}

.detailTitle{
  font-weight:bold;
  font-size:18px;
  margin-bottom:10px;
}

.smallButton{
  width:100%;
  margin-top:10px;
  padding:12px;
  font-size:15px;
}

.win{
  font-weight:bold;
}

.loss{
  font-weight:bold;
}
</style>
</head>

<body>

<main>

<h1>🏓 卓球試合分析</h1>

<div class="card">

<h2>試合情報</h2>

<label>自分</label>
<input id="meName" placeholder="自分の名前">

<label>相手</label>
<input id="oppName" placeholder="相手の名前">

<div id="saved" class="saved">
💾 自動保存されています
</div>

</div>


<div class="card">

<h2 id="gameTitle">第1ゲーム</h2>

<div class="score">
<span id="meScore">0</span>
-
<span id="oppScore">0</span>
</div>

<div class="buttons">

<button class="me" onclick="point('me')">
自分 +1
</button>

<button class="opp" onclick="point('opp')">
相手 +1
</button>

</div>

<button class="secondary" onclick="undo()">
↩ 1点戻す
</button>


<div id="reasonArea">

<b>今回の失点理由は？</b>

<div class="reasonButtons">

<button onclick="addReason('サーブミス')">
🏓 サーブミス
</button>

<button onclick="addReason('レシーブミス')">
🔄 レシーブミス
</button>

<button onclick="addReason('攻撃ミス')">
💥 攻撃ミス
</button>

<button onclick="addReason('守備ミス')">
🛡️ 守備ミス
</button>

<button onclick="addReason('判断ミス')">
🤔 判断ミス
</button>

<button onclick="addReason('その他')">
❓ その他
</button>

</div>

</div>

</div>


<div class="card">

<h2>📈 点数遷移</h2>

<div id="history" class="history">
まだありません
</div>

</div>


<div class="card">

<h2>📊 現在の分析</h2>

<div class="stat">
<span>自分の得点</span>
<b id="totalMe">0</b>
</div>

<div class="stat">
<span>相手の得点</span>
<b id="totalOpp">0</b>
</div>

<div class="stat">
<span>最大連続得点</span>
<b id="maxWin">0</b>
</div>

<div class="stat">
<span>最大連続失点</span>
<b id="maxLose">0</b>
</div>

<div class="stat">
<span>7点以降の得点率</span>
<b id="lateRate">-</b>
</div>

<div id="analysis"></div>

</div>


<div class="card">

<h2>❌ 失点理由</h2>

<div id="reasons">
まだありません
</div>

<div id="challenge"></div>

</div>


<div class="card">

<h2>🏆 ゲーム結果</h2>

<div id="games">
まだゲームがありません
</div>

</div>


<div class="card">

<h2>📚 試合履歴</h2>

<div id="matchHistory">
まだ試合履歴がありません
</div>

</div>


<button class="secondary" onclick="newMatch()">
新しい試合
</button>

</main>


<script>

/* =========================
   現在の試合
========================= */

let me=0;
let opp=0;
let game=1;

let games=[];
let points=[];
let reasons=[];

let streak=0;
let maxWin=0;
let maxLose=0;

let waitingReason=false;

let matchHistory=[];


/* =========================
   自動保存
========================= */

function saveData(){

  const data={

    meName:document.getElementById("meName").value,
    oppName:document.getElementById("oppName").value,

    me:me,
    opp:opp,
    game:game,

    games:games,
    points:points,
    reasons:reasons,

    streak:streak,
    maxWin:maxWin,
    maxLose:maxLose,

    matchHistory:matchHistory

  };

  localStorage.setItem(
    "tableTennisAnalyzer",
    JSON.stringify(data)
  );

  document.getElementById("saved").textContent=
    "💾 自動保存済み";

}


/* =========================
   復元
========================= */

function loadData(){

  const saved=
    localStorage.getItem("tableTennisAnalyzer");

  if(!saved)return;

  try{

    const data=JSON.parse(saved);

    document.getElementById("meName").value=
      data.meName || "";

    document.getElementById("oppName").value=
      data.oppName || "";

    me=data.me || 0;
    opp=data.opp || 0;
    game=data.game || 1;

    games=data.games || [];
    points=data.points || [];
    reasons=data.reasons || [];

    streak=data.streak || 0;
    maxWin=data.maxWin || 0;
    maxLose=data.maxLose || 0;

    matchHistory=data.matchHistory || [];

    waitingReason=false;

  }catch(e){

    console.log("復元エラー");

  }

}


/* 名前変更も保存 */

document.getElementById("meName")
.addEventListener("input",saveData);

document.getElementById("oppName")
.addEventListener("input",saveData);


/* =========================
   得点
========================= */

function point(who){

  if(waitingReason)return;

  if(who==="me"){

    me++;
    streak++;

    if(streak>maxWin)
      maxWin=streak;

  }else{

    opp++;
    streak--;

    if(Math.abs(streak)>maxLose)
      maxLose=Math.abs(streak);

  }

  points.push({
    who:who,
    me:me,
    opp:opp
  });

  update();

  saveData();

  if(who==="opp"){

    waitingReason=true;

    document.getElementById("reasonArea").style.display=
      "block";

  }else{

    checkGame();

  }

}


/* =========================
   失点理由
========================= */

function addReason(reason){

  reasons.push(reason);

  document.getElementById("reasonArea").style.display=
    "none";

  waitingReason=false;

  update();

  checkGame();

  saveData();

}


/* =========================
   ゲーム終了判定
========================= */

function checkGame(){

  if(
    (me>=11 || opp>=11)
    &&
    Math.abs(me-opp)>=2
  ){

    setTimeout(endGame,300);

  }

}


/* =========================
   ゲーム終了
========================= */

function endGame(){

  let winner=
    me>opp ? "自分" : "相手";

  games.push({

    game:game,
    me:me,
    opp:opp,
    winner:winner

  });

  let myWins=
    games.filter(g=>g.winner==="自分").length;

  let oppWins=
    games.filter(g=>g.winner==="相手").length;


  if(myWins>=3 || oppWins>=3){

    finishMatch();

    return;

  }


  alert(
    "第"+game+"ゲーム終了！\n"+
    me+" - "+opp+"\n"+
    winner+"のゲーム勝利"
  );


  game++;

  me=0;
  opp=0;

  points=[];
  reasons=[];

  streak=0;
  maxWin=0;
  maxLose=0;

  waitingReason=false;

  document.getElementById("reasonArea").style.display=
    "none";

  update();

  saveData();

}


/* =========================
   試合終了
========================= */

function finishMatch(){

  let myWins=
    games.filter(g=>g.winner==="自分").length;

  let oppWins=
    games.filter(g=>g.winner==="相手").length;

  let matchWinner=
    myWins>oppWins ? "自分" : "相手";


  let meName=
    document.getElementById("meName").value ||
    "自分";

  let oppName=
    document.getElementById("oppName").value ||
    "相手";


  let date=
    new Date().toLocaleString("ja-JP");


  /*
    詳細分析用データを作成
  */

  let allPoints=[];

  games.forEach(g=>{

    /*
      過去バージョンではゲームごとの
      詳細ポイントを保存していなかったため、
      今後の試合から詳細データを記録する。
    */

  });


  let reasonCount={};

  reasons.forEach(r=>{

    reasonCount[r]=(reasonCount[r]||0)+1;

  });


  let maxReasonCount=0;

  Object.values(reasonCount).forEach(n=>{

    if(n>maxReasonCount)
      maxReasonCount=n;

  });


  let topReasons=
    Object.entries(reasonCount)
    .filter(([r,n])=>n===maxReasonCount)
    .map(([r])=>r);


  matchHistory.unshift({

    date:date,

    meName:meName,

    oppName:oppName,

    myWins:myWins,

    oppWins:oppWins,

    winner:matchWinner,

    games:games.map(g=>({

      game:g.game,
      me:g.me,
      opp:g.opp,
      winner:g.winner

    })),

    reasons:reasonCount,

    topReasons:topReasons,

    totalReasons:reasons.length

  });


  alert(
    "試合終了！\n\n"+
    meName+" "+myWins+
    " - "+oppWins+" "+oppName
  );


  /*
    次の試合
  */

  me=0;
  opp=0;
  game=1;

  games=[];
  points=[];
  reasons=[];

  streak=0;
  maxWin=0;
  maxLose=0;

  waitingReason=false;

  document.getElementById("reasonArea").style.display=
    "none";

  update();

  saveData();

}


/* =========================
   1点戻す
========================= */

function undo(){

  if(points.length===0)return;

  document.getElementById("reasonArea").style.display=
    "none";

  waitingReason=false;

  points.pop();

  me=0;
  opp=0;

  streak=0;
  maxWin=0;
  maxLose=0;


  points.forEach(p=>{

    if(p.who==="me"){

      me++;
      streak++;

      if(streak>maxWin)
        maxWin=streak;

    }else{

      opp++;
      streak--;

      if(Math.abs(streak)>maxLose)
        maxLose=Math.abs(streak);

    }

  });


  update();

  saveData();

}


/* =========================
   画面更新
========================= */

function update(){

  document.getElementById("gameTitle").textContent=
    "第"+game+"ゲーム";

  document.getElementById("meScore").textContent=me;
  document.getElementById("oppScore").textContent=opp;

  document.getElementById("totalMe").textContent=me;
  document.getElementById("totalOpp").textContent=opp;

  document.getElementById("maxWin").textContent=maxWin;
  document.getElementById("maxLose").textContent=maxLose;


  let late=points.filter(p=>
    p.me>=7 || p.opp>=7
  );


  let lateMe=late.filter(p=>
    p.who==="me"
  ).length;


  document.getElementById("lateRate").textContent=

    late.length
    ? Math.round(lateMe/late.length*100)+"%"
    : "-";


  document.getElementById("history").innerHTML=

    points.length

    ? points.map((p,i)=>

      (i+1)+". "+
      (p.who==="me"?"🟢":"🔴")+" "+
      p.me+" - "+p.opp

    ).join("<br>")

    : "まだありません";


  showReasons();

  showAnalysis();

  showGames();

  showMatchHistory();

}


/* =========================
   失点理由
========================= */

function showReasons(){

  let el=document.getElementById("reasons");


  if(reasons.length===0){

    el.textContent="まだありません";

    document.getElementById("challenge").innerHTML="";

    return;

  }


  let count={};


  reasons.forEach(r=>{

    count[r]=(count[r]||0)+1;

  });


  el.innerHTML=

    Object.entries(count)

    .map(([reason,num])=>

      "・"+reason+"：<b>"+num+"回</b>"

    )

    .join("<br>");


  let max=0;
  let top=[];


  Object.entries(count).forEach(([reason,num])=>{

    if(num>max){

      max=num;
      top=[reason];

    }else if(num===max){

      top.push(reason);

    }

  });


  document.getElementById("challenge").innerHTML=

    `<div class="challenge">

    🎯 <b>今回の課題</b><br><br>

    ${top.join("・")}

    <br>

    <small>
    ${max}回の失点が記録されています。
    </small>

    </div>`;

}


/* =========================
   分析
========================= */

function showAnalysis(){

  let html="";


  if(maxLose>=3){

    html+=`

    <div class="yellow">

    ⚠️ <b>連続失点に注意</b><br>

    最大${maxLose}点連続で失点しています。<br>

    その場面を振り返ってみましょう。

    </div>

    `;

  }


  if(me>=7 && opp>=7){

    let late=points.filter(p=>
      p.me>=7 || p.opp>=7
    );


    let rate=late.length

      ? Math.round(
        late.filter(p=>p.who==="me").length
        /late.length*100
      )

      : 0;


    html+=`

    <div class="${rate<50?'yellow':'green'}">

    🎯 <b>終盤分析</b><br>

    7点以降の得点率：${rate}%<br>

    ${rate<50

      ?"終盤の得点力が課題になる可能性があります。"

      :"終盤でも得点できています。"

    }

    </div>

    `;

  }


  if(me===0 && opp===0){

    html="<p>点数を入力すると分析します。</p>";

  }


  document.getElementById("analysis").innerHTML=html;

}


/* =========================
   ゲーム結果
========================= */

function showGames(){

  let el=document.getElementById("games");


  if(games.length===0){

    el.textContent="まだゲームがありません";

    return;

  }


  el.innerHTML=

    games.map(g=>

      "第"+g.game+"ゲーム："+

      g.me+" - "+g.opp+

      "　"+g.winner+"勝利"

    ).join("<br>");

}


/* =========================
   試合履歴
========================= */

function showMatchHistory(){

  let el=
    document.getElementById("matchHistory");


  if(matchHistory.length===0){

    el.textContent=
      "まだ試合履歴がありません";

    return;

  }


  el.innerHTML=

    matchHistory.map((m,index)=>{

      let result=
        m.winner==="自分"
        ? "🏆 勝利"
        : "❌ 敗北";


      let gameScores=
        m.games.map(g=>
          g.me+"-"+g.opp
        ).join(" / ");


      return `

        <div class="matchResult">

          <div>

            <b>${result}</b>

          </div>

          <div>

            ${m.meName} vs ${m.oppName}

          </div>

          <div>

            ${gameScores}

          </div>

          <small>
            ${m.date}
          </small>


          <button
            class="secondary smallButton"
            onclick="toggleDetail(${index})">

            📊 詳しく見る

          </button>


          <div
            id="detail-${index}"
            class="detail">

            ${createDetail(m)}

          </div>

        </div>

      `;

    }).join("");

}


/* =========================
   詳細分析
========================= */

function createDetail(m){

  let html="";


  html+=`

    <div class="detailTitle">
      📊 試合詳細
    </div>

  `;


  html+=`

    <p>
      <b>試合結果</b><br>
      ${m.meName} ${m.myWins}
      - ${m.oppWins} ${m.oppName}
    </p>

  `;


  html+=`

    <p>
      <b>ゲームスコア</b><br>
      ${m.games.map(g=>
        "第"+g.game+"："+g.me+"-"+g.opp
      ).join("<br>")}
    </p>

  `;


  if(m.totalReasons>0){

    html+=`

      <p>
        <b>❌ 失点理由</b><br>

        ${Object.entries(m.reasons)
          .map(([reason,num])=>
            "・"+reason+"："+num+"回"
          )
          .join("<br>")}

      </p>

    `;


    if(m.topReasons.length>0){

      html+=`

        <div class="challenge">

          🎯 <b>この試合で多かった課題</b><br><br>

          ${m.topReasons.join("・")}

          <br><br>

          <small>
            ${m.topReasons.length===1
              ?"最も多く記録された失点理由です。"
              :"同じ回数で多かった失点理由です。"
            }
          </small>

        </div>

      `;

    }

  }else{

    html+=`

      <p>
        ❌ 失点理由は記録されていません。
      </p>

    `;

  }


  html+=`

    <p>
      💡 <b>振り返り</b><br>
      この試合のゲームスコアと
      失点理由を見返して、
      次の練習で意識するポイントを
      考えてみましょう。
    </p>

  `;


  return html;

}


/* =========================
   詳細を開閉
========================= */

function toggleDetail(index){

  let el=
    document.getElementById(
      "detail-"+index
    );


  if(el.style.display==="block"){

    el.style.display="none";

  }else{

    el.style.display="block";

  }

}


/* =========================
   新しい試合
========================= */

function newMatch(){

  if(!confirm(
    "現在の試合データを消して新しい試合を始めますか？"
  ))

    return;


  me=0;
  opp=0;

  game=1;

  games=[];
  points=[];
  reasons=[];

  streak=0;
  maxWin=0;
  maxLose=0;

  waitingReason=false;


  document.getElementById("reasonArea").style.display=
    "none";


  update();

  saveData();

}


/* =========================
   起動
========================= */

loadData();

update();

</script>

</body>
</html>
