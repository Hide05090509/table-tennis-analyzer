<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>TABLE TENNIS ANALYZER</title>
<style>
:root{
  --bg:#080d18;--panel:#111a2b;--panel2:#162238;--line:#263550;
  --text:#f4f7fb;--muted:#91a0b8;--accent:#5eead4;--accent2:#60a5fa;
  --danger:#fb7185;--gold:#fbbf24;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,#080d18 0%,#0c1424 55%,#080d18 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
.container{max-width:720px;margin:auto;padding:18px 14px 44px}
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{font-weight:900;letter-spacing:.08em;font-size:16px}
.brand span{color:var(--accent)}
.badge{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:6px 9px;border-radius:999px}
.card{background:rgba(17,26,43,.94);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.hero{padding:24px 18px;background:linear-gradient(145deg,#15243b,#0e1727);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-70px;background:rgba(94,234,212,.08)}
.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.12em}
h1{font-size:30px;line-height:1.05;margin:7px 0 8px;letter-spacing:-.04em}
h2{font-size:16px;margin:0 0 14px}
.sub{color:var(--muted);font-size:13px;line-height:1.6}
input{width:100%;background:#0b1322;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:9px;font-size:16px;outline:none}
input:focus{border-color:var(--accent)}
.primary{width:100%;background:var(--accent);color:#061019;font-weight:900;padding:15px}
.match-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.game-label{font-size:12px;color:var(--muted)}
.game-no{font-size:22px;font-weight:900}
.series{font-size:12px;color:var(--muted);background:#0b1322;border:1px solid var(--line);padding:7px 10px;border-radius:999px}
.score-card{padding:12px;background:linear-gradient(180deg,#121e32,#0e1727)}
.score-area{display:grid;grid-template-columns:1fr 28px 1fr;gap:8px;align-items:center}
.player{text-align:center;padding:12px 4px}
.player-name{font-weight:800;color:#dbe6f5;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-size:76px;line-height:1;font-weight:950;letter-spacing:-.07em;margin:10px 0 16px}
.vs{text-align:center;color:#51627e;font-weight:800}
.point-btn{width:100%;padding:15px 8px;border-radius:15px;background:#1b2a43;color:#fff;border:1px solid #30415e;font-weight:800}
.point-btn:active,.reason-btn:active,.undo:active,.finish-btn:active,.primary:active{transform:scale(.98)}
.point-btn.me{background:linear-gradient(180deg,#1c665f,#164b48);border-color:#287f77}
.point-btn.opp{background:#1b2a43}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.undo,.finish-btn{width:100%;background:#121c2d;color:#cbd6e6;border:1px solid var(--line);padding:12px}
.finish-btn{color:#fda4af;border-color:#512b36}
.status{text-align:center;color:var(--accent);font-size:12px;font-weight:800;margin-top:12px}
.reason-card{border-color:#624c1d;background:linear-gradient(180deg,#211d13,#151923)}
.notice{color:#d5c58d;font-size:12px;margin:-5px 0 12px}
.reason-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.reason-btn{background:#172237;color:#dce6f5;border:1px solid var(--line);padding:13px 7px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.section-head h2{margin:0}
.section-tag{font-size:11px;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:#0d1626;border:1px solid var(--line);border-radius:15px;padding:13px}
.stat-title{color:var(--muted);font-size:11px}
.stat-value{font-size:22px;font-weight:900;margin-top:5px}
.issue{margin-top:10px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.22);padding:13px;border-radius:14px;color:#f7e4a1;font-size:13px}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.history-item{background:#0d1626;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px}
.history-top{display:flex;justify-content:space-between;gap:10px}
.win{color:var(--accent);font-weight:900}.lose{color:var(--danger);font-weight:900}
.small{color:var(--muted);font-size:11px;margin-top:5px}
.detail{background:#101a2b;border-radius:12px;padding:11px;margin-top:10px}
.detail-btn,.delete-btn{width:100%;margin-top:10px;background:#172237;color:#dbe6f5;border:1px solid var(--line);padding:11px}
.delete-btn{color:#fda4af}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:13px}
.saved{text-align:center;color:var(--muted);font-size:11px;margin-top:8px}
.hidden{display:none!important}
.divider{height:1px;background:var(--line);margin:4px 0 15px}
@media(max-width:390px){.score{font-size:64px}.container{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="container">

<div class="header">
  <div class="brand">TABLE <span>TENNIS</span> ANALYZER</div>
  <div class="badge">MATCH ANALYSIS</div>
</div>

<div class="card hero">
  <div class="eyebrow">NEW MATCH</div>
  <h1>試合を記録する</h1>
  <div class="sub">得点・失点理由をリアルタイムで記録して、試合後に自分の課題を振り返れます。</div>
  <div style="height:16px"></div>
  <input id="meName" placeholder="自分の名前">
  <input id="oppName" placeholder="相手の名前">
  <button id="startBtn" class="primary">▶ 試合を開始する</button>
  <div id="saved" class="saved"></div>
</div>

<div id="matchArea" class="hidden">

  <div class="card score-card">
    <div class="match-head">
      <div>
        <div class="game-label">CURRENT GAME</div>
        <div class="game-no">第<span id="gameNumber">1</span>ゲーム</div>
      </div>
      <div id="gameCount" class="series">0 - 0</div>
    </div>

    <div class="score-area">
      <div class="player">
        <div id="meDisplay" class="player-name">自分</div>
        <div id="meScore" class="score">0</div>
        <button id="mePointBtn" class="point-btn me">＋ 自分の得点</button>
      </div>
      <div class="vs">VS</div>
      <div class="player">
        <div id="oppDisplay" class="player-name">相手</div>
        <div id="oppScore" class="score">0</div>
        <button id="oppPointBtn" class="point-btn opp">＋ 相手の得点</button>
      </div>
    </div>

    <div class="actions">
      <button id="undoBtn" class="undo">↩ 1点戻す</button>
      <button id="finishBtn" class="finish-btn">🏁 試合終了</button>
    </div>
    <div id="status" class="status">● 試合進行中</div>
  </div>

  <div id="reasonArea" class="card reason-card hidden">
    <h2>失点理由を記録</h2>
    <div class="notice">相手の得点になった理由を選択してください</div>
    <div class="reason-buttons">
      <button class="reason-btn" data-reason="サーブミス">サーブミス</button>
      <button class="reason-btn" data-reason="レシーブミス">レシーブミス</button>
      <button class="reason-btn" data-reason="攻撃ミス">攻撃ミス</button>
      <button class="reason-btn" data-reason="守備ミス">守備ミス</button>
      <button class="reason-btn" data-reason="判断ミス">判断ミス</button>
      <button class="reason-btn" data-reason="その他">その他</button>
    </div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2>📈 ライブ分析</h2>
      <span class="section-tag">CURRENT GAME</span>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-title">最大連続得点</div><div id="maxWin" class="stat-value">0</div></div>
      <div class="stat"><div class="stat-title">最大連続失点</div><div id="maxLose" class="stat-value">0</div></div>
      <div class="stat"><div class="stat-title">終盤得点率</div><div id="lateRate" class="stat-value">-</div></div>
      <div class="stat"><div class="stat-title">ゲーム状況</div><div id="closeGame" class="stat-value">-</div></div>
    </div>
    <div id="issue"></div>
  </div>

  <div class="card">
    <div class="section-head">
      <h2>📝 失点分析</h2>
      <span class="section-tag">REASON</span>
    </div>
    <div id="reasonList">まだ失点していません。</div>
  </div>

</div>

<div class="card">
  <div class="section-head">
    <h2>📚 試合履歴</h2>
    <span class="section-tag">HISTORY</span>
  </div>
  <div class="divider"></div>
  <div id="historyList"></div>
</div>

</div>

<script>
"use strict";

const STORAGE="table_tennis_analyzer_v7";
let me=0,opp=0,game=1,games=[],points=[],reasons=[];
let matchStarted=false,waitingReason=false,history=[];

function $(id){return document.getElementById(id)}

function save(){
  try{
    localStorage.setItem(STORAGE,JSON.stringify({
      meName:$("meName").value,oppName:$("oppName").value,
      me,opp,game,games,points,reasons,matchStarted,waitingReason,history
    }));
    $("saved").textContent="● 自動保存済み";
  }catch(e){console.log(e)}
}

function load(){
  try{
    const raw=localStorage.getItem(STORAGE);
    if(raw){
      const d=JSON.parse(raw);
      $("meName").value=d.meName||"";
      $("oppName").value=d.oppName||"";
      me=Number(d.me)||0; opp=Number(d.opp)||0; game=Number(d.game)||1;
      games=Array.isArray(d.games)?d.games:[];
      points=Array.isArray(d.points)?d.points:[];
      reasons=Array.isArray(d.reasons)?d.reasons:[];
      matchStarted=d.matchStarted===true;
      waitingReason=d.waitingReason===true;
      history=Array.isArray(d.history)?d.history:[];
    }
  }catch(e){console.log(e)}
  if(matchStarted)$("matchArea").classList.remove("hidden");
  if(waitingReason)$("reasonArea").classList.remove("hidden");
  update();renderHistory();
}

function startMatch(){
  const a=$("meName").value.trim(),b=$("oppName").value.trim();
  if(!a){alert("自分の名前を入力してください");return}
  if(!b){alert("相手の名前を入力してください");return}
  me=0;opp=0;game=1;games=[];points=[];reasons=[];
  matchStarted=true;waitingReason=false;
  $("matchArea").classList.remove("hidden");
  $("reasonArea").classList.add("hidden");
  update();save();
}

function point(player){
  if(!matchStarted)return;
  if(waitingReason){alert("先に失点理由を選択してください");return}
  if(player==="me"){
    me++;points.push({player:"me",reason:null});
  }else{
    opp++;points.push({player:"opp",reason:null});
    waitingReason=true;
    $("reasonArea").classList.remove("hidden");
  }
  update();save();
  if(player==="me")checkEnd();
}

function reason(value){
  if(!waitingReason)return;
  const last=points[points.length-1];
  if(!last||last.player!=="opp")return;
  last.reason=value;reasons.push(value);waitingReason=false;
  $("reasonArea").classList.add("hidden");
  update();save();checkEnd();
}

function checkEnd(){
  if(!matchStarted||waitingReason)return;
  if((me>=11||opp>=11)&&Math.abs(me-opp)>=2)finishGame();
}

function finishGame(){
  if(!matchStarted||waitingReason)return;
  const already=games.some(g=>g.game===game&&g.me===me&&g.opp===opp);
  if(already)return;

  games.push({
    game,me,opp,winner:me>opp?"me":"opp",
    points:points.map(p=>({player:p.player,reason:p.reason}))
  });

  const mw=games.filter(g=>g.winner==="me").length;
  const ow=games.filter(g=>g.winner==="opp").length;

  if(mw>=3||ow>=3){finishMatch();return}

  const finished=game;
  me=0;opp=0;points=[];reasons=[];waitingReason=false;game++;
  update();save();
  alert("第"+finished+"ゲーム終了！\n\n次は第"+game+"ゲームです。");
}

function finishMatch(){
  if(!matchStarted)return;
  if(waitingReason){alert("先に失点理由を選択してください");return}

  const currentFinished=(me>=11||opp>=11)&&Math.abs(me-opp)>=2;
  if(currentFinished&&!games.some(g=>g.game===game&&g.me===me&&g.opp===opp)){
    games.push({
      game,me,opp,winner:me>opp?"me":"opp",
      points:points.map(p=>({player:p.player,reason:p.reason}))
    });
  }

  const mw=games.filter(g=>g.winner==="me").length;
  const ow=games.filter(g=>g.winner==="opp").length;
  const myName=$("meName").value.trim(),oppName=$("oppName").value.trim();

  const rc={};
  games.forEach(g=>(g.points||[]).forEach(p=>{
    if(p.player==="opp"&&p.reason)rc[p.reason]=(rc[p.reason]||0)+1;
  }));

  const sorted=Object.keys(rc).sort((a,b)=>rc[b]-rc[a]);
  const top=sorted.length?sorted.filter(r=>rc[r]===rc[sorted[0]]):[];

  history.unshift({
    id:Date.now(),date:new Date().toLocaleString("ja-JP"),
    meName:myName,oppName:oppName,myWins:mw,oppWins:ow,
    winner:mw>ow?"me":"opp",
    games:JSON.parse(JSON.stringify(games)),reasons:rc,topReasons:top
  });

  matchStarted=false;waitingReason=false;
  $("matchArea").classList.add("hidden");
  $("reasonArea").classList.add("hidden");
  save();renderHistory();

  alert("🏓 試合終了！\n\n"+myName+" "+mw+" - "+ow+" "+oppName+
        "\n\n📚 試合履歴に保存しました。");

  me=0;opp=0;game=1;games=[];points=[];reasons=[];
  update();save();
}

function undo(){
  if(!matchStarted)return;
  if(!points.length){alert("戻せる点がありません");return}
  const last=points.pop();
  if(last.player==="me")me--;
  else{
    opp--;
    if(last.reason){
      const i=reasons.lastIndexOf(last.reason);
      if(i!==-1)reasons.splice(i,1);
    }
  }
  waitingReason=false;
  $("reasonArea").classList.add("hidden");
  update();save();
}

function calculateStats(){
  let w=0,l=0,mw=0,ml=0;
  points.forEach(p=>{
    if(p.player==="me"){w++;l=0;mw=Math.max(mw,w)}
    else{l++;w=0;ml=Math.max(ml,l)}
  });
  return{maxWin:mw,maxLose:ml}
}

function getLateRate(){
  if(!points.length)return"-";
  let m=0,o=0,total=0,mine=0;
  points.forEach(p=>{
    p.player==="me"?m++:o++;
    if(m>=7||o>=7){total++;if(p.player==="me")mine++}
  });
  return total?Math.round(mine/total*100)+"%":"-";
}

function getCloseGame(){
  if(!points.length)return"-";
  let m=0,o=0,total=0,close=0;
  points.forEach(p=>{
    p.player==="me"?m++:o++;
    if(m>=7||o>=7){total++;if(Math.abs(m-o)<=2)close++}
  });
  return total&&close/total>=.5?"接戦":"通常";
}

function escapeHTML(v){
  return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function renderReasons(){
  if(!reasons.length){$("reasonList").textContent="まだ失点していません。";return}
  const c={};reasons.forEach(r=>c[r]=(c[r]||0)+1);
  $("reasonList").innerHTML=Object.keys(c).sort((a,b)=>c[b]-c[a]).map(r=>
    '<div class="row"><span>'+escapeHTML(r)+'</span><strong>'+c[r]+'回</strong></div>'
  ).join("");
}

function renderIssue(){
  if(!reasons.length){$("issue").innerHTML="";return}
  const c={};reasons.forEach(r=>c[r]=(c[r]||0)+1);
  const max=Math.max(...Object.values(c));
  const top=Object.keys(c).filter(r=>c[r]===max);
  $("issue").innerHTML='<div class="issue"><strong>🎯 今回の課題</strong><br>'+
    top.map(escapeHTML).join("・")+"が"+max+"回で最も多い失点理由です。</div>";
}

function update(){
  $("meScore").textContent=me;$("oppScore").textContent=opp;
  $("gameNumber").textContent=game;
  $("meDisplay").textContent=$("meName").value.trim()||"自分";
  $("oppDisplay").textContent=$("oppName").value.trim()||"相手";

  const mw=games.filter(g=>g.winner==="me").length;
  const ow=games.filter(g=>g.winner==="opp").length;
  $("gameCount").textContent=mw+" - "+ow;

  const s=calculateStats();
  $("maxWin").textContent=s.maxWin;$("maxLose").textContent=s.maxLose;
  $("lateRate").textContent=getLateRate();$("closeGame").textContent=getCloseGame();
  $("status").textContent=matchStarted?"● 試合進行中":"";
  renderReasons();renderIssue();
}

function makeDetail(item){
  let html="<h3>ゲーム結果</h3>";
  (item.games||[]).forEach(g=>{
    html+='<div class="row"><span>第'+g.game+'ゲーム</span><strong>'+g.me+" - "+g.opp+"</strong></div>";
  });
  html+="<h3>失点理由</h3>";
  const r=item.reasons||{},keys=Object.keys(r);
  if(!keys.length)html+="<p>記録なし</p>";
  else keys.sort((a,b)=>r[b]-r[a]).forEach(k=>{
    html+='<div class="row"><span>'+escapeHTML(k)+'</span><strong>'+r[k]+'回</strong></div>';
  });
  if(item.topReasons?.length)html+='<div class="issue"><strong>🎯 試合の課題</strong><br>'+
    item.topReasons.map(escapeHTML).join("・")+"が主な失点理由でした。</div>";
  html+='<button class="delete-btn" data-delete="'+item.id+'">🗑 この試合を削除</button>';
  return html;
}

function renderHistory(){
  if(!history.length){$("historyList").innerHTML='<div class="empty">まだ試合履歴がありません。</div>';return}
  $("historyList").innerHTML=history.map(item=>{
    const win=item.winner==="me";
    const gt=(item.games||[]).map(g=>g.me+"-"+g.opp).join(" / ");
    return '<div class="history-item"><div class="history-top"><div><strong>'+
      escapeHTML(item.meName)+'</strong> vs <strong>'+escapeHTML(item.oppName)+
      '</strong></div><div class="'+(win?"win":"lose")+'">'+(win?"勝利":"敗北")+
      '</div></div><div>ゲームカウント '+item.myWins+" - "+item.oppWins+
      '</div><div class="small">'+escapeHTML(item.date||"")+'</div><div class="small">ゲーム：'+
      escapeHTML(gt)+'</div><button class="detail-btn" data-detail="'+item.id+
      '">📊 詳しく見る</button><div id="detail'+item.id+
      '" class="detail hidden">'+makeDetail(item)+'</div></div>';
  }).join("");
}

$("startBtn").addEventListener("click",startMatch);
$("mePointBtn").addEventListener("click",()=>point("me"));
$("oppPointBtn").addEventListener("click",()=>point("opp"));
$("undoBtn").addEventListener("click",undo);
$("finishBtn").addEventListener("click",finishMatch);

document.querySelectorAll(".reason-btn").forEach(btn=>{
  btn.addEventListener("click",()=>reason(btn.dataset.reason));
});

$("historyList").addEventListener("click",e=>{
  const d=e.target.closest("[data-detail]");
  if(d){const el=$("detail"+d.dataset.detail);if(el)el.classList.toggle("hidden");return}
  const del=e.target.closest("[data-delete]");
  if(del&&confirm("この試合履歴を削除しますか？")){
    history=history.filter(x=>String(x.id)!==String(del.dataset.delete));
    save();renderHistory();
  }
});

$("meName").addEventListener("input",()=>{update();save()});
$("oppName").addEventListener("input",()=>{update();save()});
window.addEventListener("pagehide",save);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")save()});

load();
</script>
</body>
</html>
