<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>卓球 試合分析</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px 14px 40px;
  background:#f4f6f8;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:26px;
  margin:5px 0 20px;
}

h2{
  font-size:20px;
  margin:0 0 15px;
}

h3{
  margin-top:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
  margin-bottom:10px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 16px;
  font-size:16px;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

.primary{
  width:100%;
  background:#222;
  color:white;
}

.score-area{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.player{
  flex:1;
  text-align:center;
}

.player-name{
  font-weight:bold;
  font-size:18px;
  margin-bottom:5px;
}

.score{
  font-size:64px;
  font-weight:bold;
  line-height:1.1;
}

.point-btn{
  width:100%;
  margin-top:10px;
  background:#eee;
}

.undo{
  width:100%;
  margin-top:12px;
  background:#f1f1f1;
}

.game-info{
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin-bottom:12px;
}

.game-score{
  text-align:center;
  font-size:15px;
  color:#666;
  margin-bottom:15px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#f5f5f5;
  border-radius:12px;
  padding:12px;
  text-align:center;
}

.stat-title{
  font-size:13px;
  color:#666;
}

.stat-value{
  font-size:22px;
  font-weight:bold;
  margin-top:4px;
}

.reason-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.reason-btn{
  background:#eee;
}

.hidden{
  display:none !important;
}

.notice{
  text-align:center;
  padding:10px;
  font-size:14px;
  color:#666;
}

.history-item{
  border:1px solid #ddd;
  border-radius:12px;
  padding:14px;
  margin-bottom:10px;
  background:white;
}

.history-header{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-bottom:8px;
}

.win{
  color:#167c35;
  font-weight:bold;
}

.lose{
  color:#c62828;
  font-weight:bold;
}

.detail{
  background:#f7f7f7;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}

.game-row{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  border-bottom:1px solid #ddd;
}

.game-row:last-child{
  border-bottom:0;
}

.small{
  font-size:13px;
  color:#666;
  margin-top:4px;
}

.empty{
  text-align:center;
  color:#777;
  padding:15px 0;
}

.reflection{
  margin-top:12px;
  padding:12px;
  border-radius:10px;
  background:#fff8df;
}

.delete-btn{
  background:#eee;
  font-size:13px;
  padding:8px 10px;
  margin-top:12px;
}

.saved{
  text-align:center;
  font-size:12px;
  color:#777;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>🏓 卓球 試合分析</h1>

<div class="card">

<h2>選手名</h2>

<input id="meName" placeholder="自分の名前">

<input id="oppName" placeholder="相手の名前">

<button class="primary" onclick="startNewMatch()">
▶ 試合開始
</button>

<div id="saved" class="saved"></div>

</div>


<div id="matchArea" class="hidden">

<div class="card">

<div class="game-info">
第<span id="gameNumber">1</span>ゲーム
</div>

<div id="gameScore" class="game-score">
ゲームカウント 0 - 0
</div>

<div class="score-area">

<div class="player">

<div id="meDisplayName" class="player-name">
自分
</div>

<div id="myScore" class="score">
0
</div>

<button class="point-btn"
onclick="addPoint('me')">
＋ 自分の得点
</button>

</div>

<div style="font-size:22px;">
-
</div>

<div class="player">

<div id="oppDisplayName" class="player-name">
相手
</div>

<div id="oppScore" class="score">
0
</div>

<button class="point-btn"
onclick="addPoint('opp')">
＋ 相手の得点
</button>

</div>

</div>

<button class="undo" onclick="undo()">
↩ 1点戻す
</button>

</div>


<div id="reasonArea" class="card hidden">

<h2>失点理由</h2>

<div class="notice">
相手の得点になった理由を選択してください
</div>

<div class="reason-buttons">

<button class="reason-btn"
onclick="selectReason('サーブミス')">
サーブミス
</button>

<button class="reason-btn"
onclick="selectReason('レシーブミス')">
レシーブミス
</button>

<button class="reason-btn"
onclick="selectReason('攻撃ミス')">
攻撃ミス
</button>

<button class="reason-btn"
onclick="selectReason('守備ミス')">
守備ミス
</button>

<button class="reason-btn"
onclick="selectReason('判断ミス')">
判断ミス
</button>

<button class="reason-btn"
onclick="selectReason('その他')">
その他
</button>

</div>

</div>


<div class="card">

<h2>📈 現在の分析</h2>

<div class="stats">

<div class="stat">
<div class="stat-title">
最大連続得点
</div>
<div id="maxWin" class="stat-value">
0
</div>
</div>

<div class="stat">
<div class="stat-title">
最大連続失点
</div>
<div id="maxLose" class="stat-value">
0
</div>
</div>

<div class="stat">
<div class="stat-title">
終盤得点率
</div>
<div id="endgameRate" class="stat-value">
-
</div>
</div>

<div class="stat">
<div class="stat-title">
接戦判定
</div>
<div id="closeGame" class="stat-value">
-
</div>
</div>

</div>

<div id="currentIssue"></div>

</div>


<div class="card">

<h2>📝 現在の失点理由</h2>

<div id="currentReasons">
まだ失点していません。
</div>

</div>

</div>


<div class="card">

<h2>📚 試合履歴</h2>

<div id="historyList">
読み込み中...
</div>

</div>

</div>


<script>

/* =========================================
   保存設定
========================================= */

const CURRENT_KEY =
"tableTennisAnalyzer";

const HISTORY_KEY =
"tableTennisMatchHistory";

const DB_NAME =
"TableTennisAnalyzerDB";

const DB_VERSION = 1;

const STORE_NAME =
"matches";


/* =========================================
   試合データ
========================================= */

let me = 0;

let opp = 0;

let game = 1;

let games = [];

let points = [];

let reasons = [];

let streak = 0;

let maxWin = 0;

let maxLose = 0;

let waitingReason = false;

let currentMatchStarted = false;

let matchHistory = [];

let db = null;


/* =========================================
   IndexedDBを開く
========================================= */

function openDB(){

return new Promise((resolve,reject)=>{

try{

if(!window.indexedDB){

reject(
new Error("IndexedDB unavailable")
);

return;

}

const request =
indexedDB.open(
DB_NAME,
DB_VERSION
);

request.onupgradeneeded =
function(event){

const database =
event.target.result;

if(
!database.objectStoreNames
.contains(STORE_NAME)
){

database.createObjectStore(
STORE_NAME,
{keyPath:"id"}
);

}

};

request.onsuccess =
function(event){

db = event.target.result;

resolve(db);

};

request.onerror =
function(){

reject(request.error);

};

}catch(error){

reject(error);

}

});

}


/* =========================================
   IndexedDB履歴取得
========================================= */

function getHistoryFromDB(){

return new Promise((resolve,reject)=>{

if(!db){

reject(
new Error("DB unavailable")
);

return;

}

try{

const transaction =
db.transaction(
STORE_NAME,
"readonly"
);

const store =
transaction.objectStore(
STORE_NAME
);

const request =
store.getAll();

request.onsuccess =
function(){

const result =
request.result || [];

result.sort(
(a,b)=>Number(b.id)-Number(a.id)
);

resolve(result);

};

request.onerror =
function(){

reject(request.error);

};

}catch(error){

reject(error);

}

});

}


/* =========================================
   IndexedDBに履歴保存
========================================= */

function saveHistoryToDB(item){

return new Promise((resolve,reject)=>{

if(!db){

reject(
new Error("DB unavailable")
);

return;

}

try{

const transaction =
db.transaction(
STORE_NAME,
"readwrite"
);

const store =
transaction.objectStore(
STORE_NAME
);

store.put(item);

transaction.oncomplete =
function(){

resolve();

};

transaction.onerror =
function(){

reject(transaction.error);

};

}catch(error){

reject(error);

}

});

}


/* =========================================
   IndexedDB履歴削除
========================================= */

function deleteHistoryFromDB(id){

return new Promise((resolve,reject)=>{

if(!db){

reject(
new Error("DB unavailable")
);

return;

}

try{

const transaction =
db.transaction(
STORE_NAME,
"readwrite"
);

const store =
transaction.objectStore(
STORE_NAME
);

store.delete(id);

transaction.oncomplete =
function(){

resolve();

};

transaction.onerror =
function(){

reject(transaction.error);

};

}catch(error){

reject(error);

}

});

}


/* =========================================
   localStorageに現在の試合保存
========================================= */

function saveCurrentData(){

try{

const data = {

meName:
document.getElementById("meName").value,

oppName:
document.getElementById("oppName").value,

me:me,

opp:opp,

game:game,

games:games,

points:points,

reasons:reasons,

streak:streak,

maxWin:maxWin,

maxLose:maxLose,

currentMatchStarted:
currentMatchStarted

};

localStorage.setItem(
CURRENT_KEY,
JSON.stringify(data)
);

document.getElementById("saved")
.textContent =
"💾 自動保存済み";

}catch(error){

console.log(
"現在データ保存エラー",
error
);

}

}


/* =========================================
   履歴をlocalStorageにも保存
========================================= */

function saveHistoryBackup(){

try{

localStorage.setItem(
HISTORY_KEY,
JSON.stringify(matchHistory)
);

}catch(error){

console.log(
"履歴バックアップ保存エラー",
error
);

}

}


/* =========================================
   localStorageから履歴
========================================= */

function loadHistoryFromLocalStorage(){

try{

let data =
localStorage.getItem(
HISTORY_KEY
);

if(!data){

/*
以前のバージョンの
保存データも確認
*/

data =
localStorage.getItem(
CURRENT_KEY
);

if(data){

const parsed =
JSON.parse(data);

if(
Array.isArray(
parsed.matchHistory
)
){

matchHistory =
parsed.matchHistory;

return;

}

}

return;

}

const parsed =
JSON.parse(data);

if(Array.isArray(parsed)){

matchHistory =
parsed;

}

}catch(error){

console.log(
"履歴復元エラー",
error
);

}

}


/* =========================================
   古い履歴をIndexedDBへ移行
========================================= */

async function migrateHistory(){

if(!Array.isArray(matchHistory)){
return;
}

if(matchHistory.length===0){
return;
}

if(!db){
return;
}

for(
const item of matchHistory
){

try{

if(!item.id){

item.id =
Date.now() +
Math.floor(
Math.random()*100000
);

}

await saveHistoryToDB(item);

}catch(error){

console.log(
"履歴移行エラー",
error
);

}

}

}


/* =========================================
   起動時データ読み込み
========================================= */

async function loadData(){

/*
最初にlocalStorageを読む。

これを先にすることで、
IndexedDBが使えない場合でも
履歴が表示される。
*/

loadHistoryFromLocalStorage();

renderHistory();


/*
現在の試合を復元
*/

try{

const saved =
localStorage.getItem(
CURRENT_KEY
);

if(saved){

const data =
JSON.parse(saved);

document.getElementById(
"meName"
).value =
data.meName || "";

document.getElementById(
"oppName"
).value =
data.oppName || "";

me =
Number(data.me) || 0;

opp =
Number(data.opp) || 0;

game =
Number(data.game) || 1;

games =
Array.isArray(data.games)
? data.games
: [];

points =
Array.isArray(data.points)
? data.points
: [];

reasons =
Array.isArray(data.reasons)
? data.reasons
: [];

streak =
Number(data.streak) || 0;

maxWin =
Number(data.maxWin) || 0;

maxLose =
Number(data.maxLose) || 0;

currentMatchStarted =
Boolean(
data.currentMatchStarted
);

}

}catch(error){

console.log(
"現在試合復元エラー",
error
);

}


/*
IndexedDBをバックグラウンドで
読み込む。

ここで失敗しても
アプリは止めない。
*/

try{

await openDB();

const dbHistory =
await getHistoryFromDB();

if(
Array.isArray(dbHistory) &&
dbHistory.length>0
){

matchHistory =
dbHistory;

saveHistoryBackup();

renderHistory();

}else{

/*
IndexedDBが空なら
localStorage履歴を移行
*/

await migrateHistory();

}

}catch(error){

console.log(
"IndexedDB使用不可:",
error
);

/*
何もしない。
すでにlocalStorageの
履歴が表示されている。
*/

}


/*
最後にUI更新
*/

if(currentMatchStarted){

document.getElementById(
"matchArea"
).classList.remove(
"hidden"
);

}

updateUI();

renderHistory();

}


/* =========================================
   新しい試合
========================================= */

function startNewMatch(){

const meName =
document.getElementById(
"meName"
).value.trim();

const oppName =
document.getElementById(
"oppName"
).value.trim();

if(!meName){

alert(
"自分の名前を入力してください"
);

return;

}

if(!oppName){

alert(
"相手の名前を入力してください"
);

return;

}


me=0;

opp=0;

game=1;

games=[];

points=[];

reasons=[];

streak=0;

maxWin=0;

maxLose=0;

waitingReason=false;

currentMatchStarted=true;


document.getElementById(
"matchArea"
).classList.remove(
"hidden"
);

updateUI();

saveCurrentData();

}


/* =========================================
   得点
========================================= */

function addPoint(player){

if(!currentMatchStarted){
return;
}

if(waitingReason){

alert(
"先に失点理由を選択してください"
);

return;

}


if(player==="me"){

me++;

if(streak<0){

streak=1;

}else{

streak++;

}

maxWin =
Math.max(
maxWin,
streak
);

points.push({

player:"me",

reason:null

});

}else{

opp++;

if(streak>0){

streak=-1;

}else{

streak--;

}

maxLose =
Math.max(
maxLose,
Math.abs(streak)
);

points.push({

player:"opp",

reason:null

});

waitingReason=true;

document.getElementById(
"reasonArea"
).classList.remove(
"hidden"
);

}


updateUI();

saveCurrentData();


/*
自分の得点なら
すぐゲーム終了判定
相手得点なら
理由入力後に判定
*/

if(player==="me"){

checkGameEnd();

}

}


/* =========================================
   失点理由
========================================= */

function selectReason(reason){

if(!waitingReason){
return;
}

const last =
points[points.length-1];

if(
last &&
last.player==="opp"
){

last.reason=reason;

reasons.push(reason);

}

waitingReason=false;

document.getElementById(
"reasonArea"
).classList.add(
"hidden"
);

updateUI();

saveCurrentData();

checkGameEnd();

}


/* =========================================
   ゲーム終了判定
========================================= */

function checkGameEnd(){

if(
(me>=11 || opp>=11) &&
Math.abs(me-opp)>=2
){

endGame();

}

}


/* =========================================
   ゲーム終了
========================================= */

function endGame(){

const winner =
me>opp
? "me"
: "opp";


games.push({

game:game,

me:me,

opp:opp,

winner:winner,

points:
points.map(
p=>({...p})
)

});


const myWins =
games.filter(
g=>g.winner==="me"
).length;

const oppWins =
games.filter(
g=>g.winner==="opp"
).length;


/*
3ゲーム先取
*/

if(
myWins>=3 ||
oppWins>=3
){

finishMatch();

return;

}


/*
次のゲーム
*/

const finishedGame =
game;

me=0;

opp=0;

game++;

points=[];

reasons=[];

streak=0;

maxWin=0;

maxLose=0;

waitingReason=false;

updateUI();

saveCurrentData();

alert(
`第${finishedGame}ゲーム終了！\n\n` +
`次は第${game}ゲームです。`
);

}


/* =========================================
   試合終了
========================================= */

async function finishMatch(){

const meName =
document.getElementById(
"meName"
).value.trim();

const oppName =
document.getElementById(
"oppName"
).value.trim();


const myWins =
games.filter(
g=>g.winner==="me"
).length;

const oppWins =
games.filter(
g=>g.winner==="opp"
).length;


const winner =
myWins>oppWins
? "me"
: "opp";


/*
失点理由集計
*/

const reasonCount={};

games.forEach(g=>{

if(!Array.isArray(g.points)){
return;
}

g.points.forEach(p=>{

if(
p.player==="opp" &&
p.reason
){

reasonCount[p.reason] =
(reasonCount[p.reason] || 0) + 1;

}

});

});


const sorted =
Object.entries(
reasonCount
).sort(
(a,b)=>b[1]-a[1]
);


const highest =
sorted.length
? sorted[0][1]
: 0;


const topReasons =
sorted
.filter(
([reason,count])=>
count===highest
)
.map(
([reason])=>reason
);


const item={

id:
Date.now() +
Math.floor(
Math.random()*1000
),

date:
new Date().toLocaleString(
"ja-JP"
),

meName:meName,

oppName:oppName,

myWins:myWins,

oppWins:oppWins,

winner:winner,

games:
games.map(
g=>({

game:g.game,

me:g.me,

opp:g.opp,

winner:g.winner,

points:
Array.isArray(g.points)
? g.points.map(
p=>({...p})
)
:[]

})
),

reasons:{
...reasonCount
},

topReasons:
topReasons,

totalReasons:
Object.values(reasonCount)
.reduce(
(a,b)=>a+b,
0
)

};


/*
まず履歴をメモリに追加
*/

matchHistory.unshift(item);


/*
localStorageバックアップ
*/

saveHistoryBackup();


/*
IndexedDB保存を試す
*/

let dbSaved=false;

try{

if(!db){

await openDB();

}

await saveHistoryToDB(item);

dbSaved=true;

}catch(error){

console.log(
"IndexedDB保存失敗:",
error
);

}


/*
履歴表示
*/

renderHistory();


/*
試合終了
*/

alert(
`試合終了！\n\n` +
`${meName} ${myWins} - ${oppWins} ${oppName}\n\n` +
`試合履歴に保存しました。`
);


/*
現在試合リセット
*/

me=0;

opp=0;

game=1;

games=[];

points=[];

reasons=[];

streak=0;

maxWin=0;

maxLose=0;

waitingReason=false;

currentMatchStarted=false;


document.getElementById(
"matchArea"
).classList.add(
"hidden"
);


saveCurrentData();

}


/* =========================================
   1点戻す
========================================= */

function undo(){

if(points.length===0){

alert(
"戻せる点がありません"
);

return;

}


const last =
points.pop();


if(last.player==="me"){

me--;

}else{

opp--;

if(last.reason){

const index =
reasons.lastIndexOf(
last.reason
);

if(index!==-1){

reasons.splice(
index,
1
);

}

}

}


/*
統計を再計算
*/

recomputeStats();

waitingReason=false;

document.getElementById(
"reasonArea"
).classList.add(
"hidden"
);

updateUI();

saveCurrentData();

}


/* =========================================
   統計再計算
========================================= */

function recomputeStats(){

let win=0;

let lose=0;

maxWin=0;

maxLose=0;


points.forEach(p=>{

if(p.player==="me"){

win++;

lose=0;

maxWin =
Math.max(
maxWin,
win
);

}else{

lose++;

win=0;

maxLose =
Math.max(
maxLose,
lose
);

}

});


if(points.length===0){

streak=0;

return;

}


let count=0;

const lastPlayer =
points[
points.length-1
].player;


for(
let i=points.length-1;

/* =========================================
   終盤得点率
========================================= */

function getEndgameRate(){

if(points.length===0){
return "-";
}

let my=0;

let op=0;

let total=0;

let mine=0;


points.forEach(p=>{

if(p.player==="me"){
my++;
}else{
op++;
}

if(my>=7 || op>=7){

total++;

if(p.player==="me"){
mine++;
}

}

});


if(total===0){
return "-";
}


return Math.round(
mine/total*100
)+"%";

}


/* =========================================
   接戦
========================================= */

function getCloseGame(){

if(points.length===0){
return "-";
}

let my=0;

let op=0;

let late=0;

let close=0;


points.forEach(p=>{

if(p.player==="me"){
my++;
}else{
op++;
}

if(my>=7 || op>=7){

late++;

if(
Math.abs(my-op)<=2
){

close++;

}

}

});


if(late===0){
return "-";
}


return close/late>=0.5
? "接戦"
: "通常";

}
